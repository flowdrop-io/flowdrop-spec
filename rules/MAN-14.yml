id: MAN-14
family: GR-MAN
part: I

title: Strictness polices the caller, never the stored manifest
summary: >-
  A caller can fix the key they sent. They cannot fix a manifest entry someone
  else stored, so failing their launch over it helps nobody.

normative: >-
  A malformed manifest entry (one missing a `name`, a `node_id` or a `port`, or
  carrying an empty one) MUST be dropped while resolving launch inputs, including
  where undeclared caller keys are refused. A warning is logged for it. Strictness
  MUST apply to what the caller supplied. It MUST NOT apply to what the workflow
  stored.

posture: normative-target
level: extended
profiles:
  - storage-api

added: "1.0"
changed: "1.0"

