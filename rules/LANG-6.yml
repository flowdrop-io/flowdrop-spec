id: LANG-6
family: GR-LANG
part: I

title: Expression-language evaluation fails loudly

normative: >-
  An expression-language expression that cannot be parsed, that cannot be evaluated, or
  that references a name absent from the context MUST fail by raising an error. It MUST
  yield no value.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

