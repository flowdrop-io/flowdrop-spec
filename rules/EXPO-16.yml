id: EXPO-16
family: GR-EXPO
part: I

title: Seeding a port's default-exposure decision

summary: >-
  Withdrawn (OPEN-33): how an implementation arrives at a port's stated default exposure is its own business.

normative: >-
  An authoring surface seeded a port's default-exposure decision from a processor's
  suggestion. Seeding is the implementation's own; the specification reads only the
  stated value (CFG-2).

