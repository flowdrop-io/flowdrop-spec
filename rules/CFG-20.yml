id: CFG-20
family: GR-CFG
part: I

title: A parameter's when_missing flag is fail unless the node type says skip
summary: >-
  Most required parameters fail their node when nothing resolves. A few, such as a
  trigger node's event, mean "this node has nothing to do" when nothing resolves. The
  flag lets a node type say which, and keeps the default every existing node type has.

normative: >-
  A parameter's `when_missing` flag takes one of two values, `fail` or `skip`. The flag
  is read from the node type's own parameter configuration, as the gate flags are
  (SCH-2). Where the node type records no value, an implementation MUST treat the flag
  as `fail`. The flag has no effect on a parameter that is not required.

posture: normative-target
level: extended
