id: PIPE-1
family: RT-PIPE
part: II

title: Run status is read from persisted state, on two routes and one envelope
summary: >-
  The live picture of a run is whatever has been persisted for it, not what some
  in-memory tracker happens to remember. A poll therefore answers the same value
  to every caller, including one served by a process that has just started.

normative: >-
  A run's status MUST be published by two reads: the full pipeline document and a
  lightweight status document. Both MUST answer the standard `{success: true, data}`
  envelope. Both MUST publish the persisted lifecycle value verbatim as
  `data.status`. Both MUST answer `404` with `{success: false, error}` for a run
  that does not exist. Both MUST answer `403` for a run the caller may not view. The
  full document MUST carry `node_statuses`, `jobs`, `job_status_summary` and
  `execution_data` alongside `id`, `name`, `description`, `createdAt`,
  `lastExecuted`, `executionCount` and `timestamp`. The lightweight document MUST
  carry `id`, `status`, `createdAt`, `lastExecuted`, `pendingInterrupt` and
  `pausedReason`. The lightweight document MUST NOT carry the jobs payload. Both
  MUST read persisted state only, so a status written outside the request path is
  what the next poll returns.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

rulings:
