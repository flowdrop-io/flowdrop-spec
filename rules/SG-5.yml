id: SG-5
family: RT-SG
part: II

title: loop_back is a value on a ForEach node and a bare signal everywhere else

normative: >-
  On a ForEach node the reserved `loop_back` input MUST carry the round's item
  result, standing in for an explicit `item_result` input wherever that is
  absent. On every other node type the reserved `loop_back` input MUST be a
  re-entry signal only: the value is delivered on the port and read by nobody,
  since a node with no iteration state has nothing to fold it into. Where a node
  type declares its own port for the value, the reserved injection MUST NOT
  apply.

posture: normative-target
level: extended
profiles:
  - runtime

