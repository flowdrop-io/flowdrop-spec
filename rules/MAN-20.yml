id: MAN-20
family: GR-MAN
part: I

title: The API maps a client interface onto the stored manifest
summary: >-
  What an editor calls an interface entry and what the server stores as a manifest
  entry are the same thing under two vocabularies. This is the mapping, including
  what it deliberately ignores.

normative: >-
  A workflow's API MUST accept an `interface` object. It MUST map the object onto the
  stored input and output manifests. An entry's client-side identifier MUST become the
  server-side input name; renaming either is a breaking change for callers. An entry
  carries exactly one binding, whose node and port identifiers MUST become the entry's
  `node_id` and `port`. An entry carrying more than one binding MUST be refused with
  400. The request MUST store nothing. An entry carrying no binding is a client-side
  draft. It MUST be skipped, so it is not stored. It MUST NOT be an error. A declared
  data type, a schema, a default value and free-form metadata on an entry MUST be
  ignored on write. The type and schema are derived server-side from the bound port,
  and the other two have no server representation. Input-side author metadata (the
  entry's display name, description, examples and required flag) MUST round-trip as
  author-written manifest metadata does. An output entry carries its name and binding,
  and none of that metadata. The mapped manifests MUST be applied before the workflow
  is validated. An entry naming a node or port that does not exist MUST be refused
  with 422 by workflow validation. The API's own 400 refusals MUST cover the entry's
  shape only.

posture: normative-target
level: extended
profiles:
  - storage-api

