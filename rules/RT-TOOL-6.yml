id: RT-TOOL-6
family: RT-TOOL
part: II

title: Artifacts are bounded once, at the point they are collected

normative: >-
  An implementation MUST bound the artifacts one run collects. It MUST enforce
  that bound at the single point of collection. Nothing downstream re-checks what
  one run collected. It MUST accept a payload of at least 512 KB once
  JSON-encoded. It MUST accept at least 50 artifacts in a run. It MUST accept at
  least 2 MB of encoded payload across a run in aggregate. An artifact whose
  payload does not encode, or which exceeds a bound, MUST be dropped. The drop
  comes with a warning naming the tool, the run, the artifact's type and the call.
  The run MUST NOT fail because of a drop. The retained array MUST NOT carry a
  placeholder for what was dropped. A drop applies per artifact: a later, smaller
  artifact that fits the remaining budget MUST still be kept. An artifact with an
  empty `type` MUST be refused outright. A payload is untrusted tool and model
  output. A consumer MUST treat every value in it as plain text and escape it on
  output.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

rulings:
