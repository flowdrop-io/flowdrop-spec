id: ORC-9
family: RT-ORC
part: II

title: A pipeline engine is a ready-work loop
summary: >-
  Re-entering a node on a later pass is what makes loops possible at all, and the empty
  pass is what defines the end of the run.

normative: >-
  A pipeline engine MUST repeatedly ask for the work that is ready. Each pass MUST promote
  every idle unit of work whose dependencies are met to pending, and MUST persist that
  promotion. It MUST then return all pending work (including work already pending from an
  earlier pass), ordered ascending by priority, so that a lower priority number runs
  first. A unit whose dependencies are unmet MUST be left idle and untouched. The engine
  MUST stop when a pass returns nothing; that empty return is what quiescence means.

posture: normative-target
level: core
profiles:
  - runtime

