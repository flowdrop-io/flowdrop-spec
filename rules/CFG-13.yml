id: CFG-13
family: GR-CFG
part: I

title: A processor sees its declared parameters and nothing else

summary: >-
  The resolved parameter set is shaped by the processor's own schema, not by
  whatever happens to be in the stored config. A key nobody declared cannot arrive
  by being typed into config.

normative: >-
  The resolved parameter set MUST contain no key other than a parameter of the node's
  effective parameter schema (DYN-8): one the processor's parameter schema declares, or
  one of the node's dynamic parameters.
  A configuration key matching no declared parameter MUST NOT be resolved, and MUST NOT
  reach the processor.

posture: normative-target
level: core
profiles:
