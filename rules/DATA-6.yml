id: DATA-6
family: RT-DATA
part: II

title: Initial data fills a node's ports only where no edge did

normative: >-
  Initial data supplied with a run, keyed by node identifier, MUST fill that node's
  input ports underneath anything an edge delivered. An edge-delivered value MUST
  win over initial data, including an edge-delivered `null`. An entry keyed for
  another node, or one that is not a map of port names to values, MUST be ignored.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

rulings:
