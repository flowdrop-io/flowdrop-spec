id: R7.d
family: GR-VAL
part: I

title: An edge to a port the node does not have is refused

normative: >-
  An edge whose source port is not an output port of its source node, or whose target
  port is not an input port of its target node, MUST be refused with
  `R7_EDGE_PORT_MISSING` at `edge.{index}`, once for each such end. A node's ports are
  those of its effective schemas (DYN-8) together with the reserved ports its node type
  carries. Where an end cannot be judged (R7.e/f), this check MUST be skipped for that
  end.

posture: normative-target
level: extended
