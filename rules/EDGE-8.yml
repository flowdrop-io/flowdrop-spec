id: EDGE-8
family: GR-EDGE
part: I

title: A condition on an edge is tolerated, warned about, and ignored

normative: >-
  A stored `edge.data.condition` MUST be accepted and MUST round-trip unchanged. It
  MUST NOT gate anything: the edge MUST always route. A non-empty string condition is
  reported as a warning each time the source node's outgoing edges are resolved, so a
  source that executes more than once (inside a loop) warns each time rather than once
  per run. An absent or empty condition is silent.

posture: normative-target
level: extended
profiles:
  - storage-api
  - runtime

added: "1.0"
changed: "1.0"

rulings:
  - OPEN-25
