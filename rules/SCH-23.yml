id: SCH-23
family: GR-SCHEMA
part: I

title: When a node has a ui schema, and when it has none
summary: >-
  The ui schema is what turns a flat config form into grouped sections. Whether
  there is one at all is decided by a single question about the final schema.

normative: >-
  The ui schema MUST be generated from the final config schema, after every reserved
  property has been injected. It MUST be null if and only if no property carries a
  registered group: a property tagged with an unregistered group falls into the
  default bucket, so a schema tagged only with unregistered groups also yields null,
  and the form stays on its flat path. Groups MUST be collapsed by default. A group
  MUST be opened for a node instance where that instance sets one of the fields in it.

posture: normative-target
level: extended
profiles:
