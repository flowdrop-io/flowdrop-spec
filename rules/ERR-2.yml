id: ERR-2
family: RT-ERR
part: II

title: Retryability is marked by presence, not by a boolean
summary: >-
  The absence of the marker is load-bearing: the retry gate tests for the literal
  value true, so anything else (including an explicit false) means do not retry.

normative: >-
  An error output that came from a retryable failure MUST carry `error_retryable` set
  to `true`. An error output from a non-retryable failure MUST omit the key entirely
  rather than setting it to `false`. A node MUST NOT be retried unless the value of
  `error_retryable` is literally `true`.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

