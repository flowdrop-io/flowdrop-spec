id: R6.a
family: GR-VAL
part: I

title: Config is a JSON object

summary: >-
  Every other rule about config addresses it by key, which presumes an object. This
  is the rule that says so, and it holds for nodes no schema is judging.

normative: >-
  A node's `data.config`, where present, MUST be a JSON object. A string, number,
  boolean or JSON array MUST be refused with `R6_CONFIG_INVALID` at `node.{id}.config`
  (where `{id}` is the node's id), and the save MUST NOT take effect. This check
  concerns config's shape rather than its contents, so it MUST apply to every node,
  including a node that records no node type and a node whose node type does not
  resolve, neither of which has a derived schema against which the rest of R6 could
  judge anything (R6.j).

posture: normative-target
level: core
profiles:
