id: DYN-6
family: GR-DYN
part: I

title: A dynamic port is an ordinary port once overlaid
summary: >-
  Exposure, wiring, stripping and interface binding work on a dynamic port exactly
  as on a declared one. The only thing that differs is where the port comes from.

normative: >-
  A dynamic port MUST be treated as any port of the node's effective schemas (DYN-8).
  Its exposure MUST resolve as R7.c resolves any port's, starting from exposed. An edge
  to or from it MUST be judged by R7, a hidden dynamic output MUST be stripped
  (EXPO-11), and a workflow interface entry MUST be able to bind it as it binds a
  declared port (R4.d, R10).

posture: normative-target
level: extended
profiles:
