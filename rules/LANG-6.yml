id: LANG-6
family: GR-LANG
part: I

title: Expression-language evaluation fails loudly

normative: >-
  An expression-language expression that cannot be parsed, that cannot be
  evaluated, or that references a name absent from the context fails: it raises an
  error and yields no value.

posture: normative-target
level: core
profiles:
  - runtime

