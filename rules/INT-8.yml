id: INT-8
family: RT-INT
part: II

title: Snapshot validation reports named errors and non-fatal warnings

summary: >-
  Validating a snapshot against a workflow definition answers with codes a caller
  can act on, and draws a hard line between what invalidates a snapshot and what is
  merely worth saying.

normative: >-
  Validating a snapshot against a workflow definition MUST yield a result carrying named
  codes. Each of the following errors MUST make the result invalid: a version mismatch;
  one unknown-node error per snapshot node absent from the definition; and one
  dependency-not-met error per completed node whose dependency has no recorded state or
  is neither completed nor skipped. The version check MUST be skipped when the
  snapshot's workflow version is absent. An empty version is a value, and MUST be
  compared like any other. The following warnings MUST NOT make the result invalid: one
  per definition node missing from the snapshot, and one per completed injected node
  that has dependencies.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

