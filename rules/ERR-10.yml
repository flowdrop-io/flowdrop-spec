id: ERR-10
family: RT-ERR
part: II

title: A routed failure activates error edges only, and only when it is current
summary: >-
  Two independent staleness rules guard the handler, because a loop can both re-run a
  node and route a failure from an earlier round.

normative: >-
  A node whose failure was routed MUST satisfy only its error edges. Error edges MUST
  be evaluated before trigger and data edges. Error edges MUST combine with OR
  semantics: one satisfied error edge activates the handler. A routed failure MUST NOT
  make a success-path successor ready. A routed failure MUST NOT activate its handler
  when a newer unit of work exists for the same node. A routed failure MUST NOT
  activate its handler when it was routed in an earlier round than the round the
  handler has already handled.

posture: normative-target
level: extended
profiles:
  - runtime

