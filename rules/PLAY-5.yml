id: PLAY-5
family: RT-PLAY
part: II

title: The session list is ownership-scoped, and an emptied filter means none
summary: >-
  The failure mode this rules out is an explicit request for no sessions answered
  with every sibling session in the workflow.

normative: >-
  A caller without authority to view any session MUST see only sessions they own.
  The ownership condition MUST bind the list and its total count alike, on the default
  path and on the filtered path, so the `ids` filter can only narrow what the caller
  could already see. Where the filter is present but every value in it parses away,
  the list MUST answer an empty page with a total of zero. It MUST NOT fall through
  to the unfiltered list.

posture: normative-target
level: extended
profiles:
