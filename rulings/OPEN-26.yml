id: OPEN-26
headline: An absent member was not provided, a null was provided with no value, and empty is always a value.
question: >-
  The conventions said that an absent member and a null member are different, but
  not what either one means. The parameter tiers, edge delivery and workflow outputs
  agreed with each other: a missing key is not provided, and a null is a real value
  that wins over config. Other rules read the states another way. A null node-type
  default counted as no default, an extraction that matched a null counted as a miss,
  an absent edge handle became the empty string, an empty snapshot version skipped
  its check, and a blank tool call id was dropped. Unbound workflow outputs (OPEN-27)
  could not be specified until null had one meaning.
decided: "2026-10-24"
decision: >-
  Every payload in the specification reads the states of a member one way. An absent
  member was not provided, and a fallback the rules give for it applies. A null member
  was provided with no value: it is a choice, it takes the place of any fallback, and
  in a partial update it clears the stored value, as in JSON Merge Patch (RFC 7396).
  An empty member ("", [], {}, false, 0) was provided with a value, and no rule reads
  it as absent or as null. There are no exceptions for empty values, because a value
  that one rule reads as absent changes meaning when it is serialized and read back
  by another implementation. An output that produced no value is absent from a run
  result, and null appears there only when a node produced null, so a null never
  overrides the next node's config by accident. The definition agrees with JSON
  Schema, which the contracts and port schemas are written in. A node parameter is
  the one named exception: required means non-null once resolved (CFG-9), and a
  resolved null is not validated against the parameter's type (CFG-10). CFG-3,
  LANG-24, EDGE-2, INT-8, MEM-16 and STORE-4 are rewritten to follow the definition,
  and R8.a, R8.b, R12 and R13 say "absent or empty" where they relied on EDGE-2
  turning an absent edge end into the empty string. The rules that read an empty
  value as absent stop doing so: an empty active-branch list is a branch decision
  (BR-1, BR-2), an empty edge type is an unrecognised one (EDGE-5), and an empty
  flow id is refused while an absent one is minted (STORE-9). Path evaluation
  reports whether it matched, so a matched null is never taken for a miss (LANG-8,
  LANG-9, LANG-19). A snapshot of a run with no workflow leaves its version absent
  (INT-6), and R6.i calls a null config value present rather than unset.
affects:
  - conventions
  - CFG-3
  - CFG-9
  - CFG-10
  - LANG-24
  - EDGE-2
  - INT-8
  - MEM-16
  - STORE-4
  - MAN-17
  - R8.a
  - R8.b
  - R12
  - R13
  - STORE-9
  - INT-6
  - LANG-8
  - LANG-9
  - LANG-19
  - R6.i
  - BR-1
  - BR-2
  - EDGE-5
