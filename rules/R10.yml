id: R10
family: GR-VAL
part: I

title: A workflow never exposes a port hidden on its node

summary: >-
  Hidden means hidden in both directions. R7 stops an edge reaching a hidden
  port; R10 stops the workflow's public surface reaching one.

normative: >-
  A bound workflow exposure entry MUST name a port that is exposed on the target node
  instance, as EXPO-2 resolves it. An entry naming a hidden port MUST be refused with
  `R10_EXPOSURE_HIDDEN_PORT`, and the error MUST name the workflow port, the node and
  the node's port. R10 and R7 are disjoint by construction (R7 judges edges, R10 judges
  exposure entries), so one hidden port never earns one exposure entry two reports. An
  unbound entry has no port, and R10 does not apply to it.

posture: normative-target
