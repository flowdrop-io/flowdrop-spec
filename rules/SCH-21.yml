id: SCH-21
family: GR-SCHEMA
part: I

title: The reserved config properties every node carries

normative: >-
  `instanceTitle` and `instanceDescription` MUST be injected into every node's config
  schema. `maxRetries` and `ports` MUST be injected into an executable node's config
  schema, and MUST NOT be injected into any other node's. Each injection MUST be
  skipped where the node type already declares a property of that name.

posture: normative-target
level: extended
profiles:
  - storage-api
  - editor-client

added: "1.0"
changed: "1.0"

rulings:
