id: API-7
family: GR-API
part: I

title: A generic failure is a last resort, never a design

summary: >-
  A catch-all failure answer is a reporting device. Where it stands in for a refusal the
  endpoint could have named, it renders "this endpoint has never worked" indistinguishable
  from "the server hiccupped".

normative: >-
  A failure an implementation cannot attribute to a specific cause MUST be answered
  with a fixed generic message. The underlying failure's own message is logged, and
  MUST NOT reach the response body. A failure an implementation can classify MUST be
  answered as that classification (a client error as a client error, a refusal by the
  name the endpoint has for it). A generic server failure MUST NOT stand in for a
  refusal the endpoint is able to name.

posture: normative-target
level: extended
profiles:
  - storage-api

