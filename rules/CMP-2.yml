id: CMP-2
family: RT-CMP
part: II

title: Compilation always re-enriches node metadata from the live node types
summary: >-
  Stored node metadata is a cache, and an author-editable one. Compilation refreshes
  it from the node types themselves so a run can never be planned against stale or
  attacker-supplied metadata.

normative: >-
  Compilation MUST re-enrich every node's metadata from the live node type
  definitions before planning the run. This MUST hold at every entry point into
  compilation, so that no caller can compile a workflow whose stored node metadata
  is taken on trust. The re-enriched workflow MUST be normalized before it is
  compiled.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

