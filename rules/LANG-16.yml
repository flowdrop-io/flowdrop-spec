id: LANG-16
family: GR-LANG
part: I

title: A string context is parsed as JSON where it parses

normative: >-
  Where the evaluation context is a string, it MUST be parsed as JSON. The path MUST
  query the parsed value. A string that is not valid JSON MUST be used as-is. The string
  `null` parses to null, like any other JSON document.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

rulings:
  - OPEN-25
