id: SG-11
family: RT-SG
part: II

title: Every node completion writes a checkpoint, and the run writes a last one

normative: >-
  A run MUST write a checkpoint as each node completes, each chained to the
  checkpoint before it. A run MUST write a final checkpoint named `workflow_end`
  when the run ends. An implementation MUST offer at least an ephemeral
  checkpoint store, which lives no longer than the request that created it, and
  a durable one, which outlives it. A run that asks for a checkpoint store the
  implementation does not know MUST be refused.

posture: normative-target
level: extended
profiles:
  - runtime

