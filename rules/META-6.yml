id: META-6
family: RT-META
part: II

title: The entity tag carries the body variant, not just the schema version
summary: >-
  Without the variant in the tag, a client holding the plain body that asks for
  the annotated one is told it is unchanged, and goes on serving a document with
  every title and description missing.

normative: >-
  The entity tag for a workflow schema MUST be the quoted schema version for the
  plain document, and the quoted schema version plus a variant marker for the
  annotated one. Any request argument that changes the body MUST join the tag the
  same way. Two documents that differ MUST NOT share a tag, whatever else varies
  on them.

posture: normative-target
level: core
profiles:
  - runtime
  - editor-client

