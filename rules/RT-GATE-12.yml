id: RT-GATE-12
family: RT-GATE
part: II

title: A resolved secret never persists in the gate prompt

summary: >-
  The prompt an operator reads is stored verbatim. A credential that was substituted
  into an argument is not stored along with it, while the consent still
  bind to the real call.

normative: >-
  Where a secret reference was substituted into a parameter's value, the whole value
  of that parameter MUST be replaced with `<secret>` in the prompt shown to the
  operator and persisted with the interrupt. The parameter MUST be tracked by its top-level name rather than by matching the secret's text, because the substitution can
  be partial or nested inside a structured value. The consent arguments MUST keep the
  real values, so that consents for different secret values remain distinguishable.
  The consent arguments MUST NOT be persisted other than as a digest (RT-GATE-3). This
  rule covers only secrets supplied by configuration. A value delivered by an edge or
  produced upstream MUST be shown as it is, because the operator is approving what
  will be sent.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

rulings:
  - OPEN-25

related:
