id: R6.h
family: GR-VAL
part: I

title: A value that does not match its pattern is refused

summary: >-
  A string that does not match its pattern is refused. A pattern that is not a valid
  regular expression is a defect in the node type, not in the workflow (SCH-24).

normative: >-
  A string config value that does not match its schema's `pattern` MUST be refused with
  `R6_CONFIG_INVALID` at `node.{id}.config.{key}`. A `pattern` that is not a valid
  regular expression makes the schema invalid; that is the node type's failure
  (SCH-24), and R6.j applies.

posture: normative-target
level: core
profiles:
  - storage-api

