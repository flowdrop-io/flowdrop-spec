id: RT-TOOL-8
family: RT-TOOL
part: II

title: A model's tool arguments are normalized against the tool's own schema

summary: >-
  Models hand back arguments that are nearly right: a JSON array as a string, a
  value escaped twice. Normalization repairs only the cases the tool's own
  schema can vouch for, and leaves the rest for validation to report honestly.

normative: >-
  Before a tool is invoked, the arguments a model supplied MUST be reconciled with
  the tool's declared input schema. A string argument MUST be decoded as JSON
  when three conditions hold, and MUST NOT be decoded otherwise. The conditions
  are that the schema declares that parameter `array` or `object`, that the string
  parses as JSON, and that the parsed shape matches what was declared: an array
  for `array`, a map for `object`. A parameter declared `string` MUST NOT be
  decoded. A parsed value of the wrong shape MUST NOT be substituted. An argument
  that fails any of the three MUST be passed through unmodified. Independently,
  every string leaf of an argument MUST have its HTML character references
  decoded, repeated until the value stops changing, so that a doubly-escaped value
  resolves fully rather than one level short. An implementation MAY bound the
  number of passes. Keys MUST NOT be modified. Text containing no character
  reference MUST be returned unchanged.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

references:
  normative:
    - source: HTML Standard
      title: Named character references
      url: https://html.spec.whatwg.org/multipage/named-characters.html
      note: The set of named references a string argument is decoded against.

rulings:
  - OPEN-25
