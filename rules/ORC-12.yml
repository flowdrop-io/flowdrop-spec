id: ORC-12
family: RT-ORC
part: II

title: Asynchronous execution returns immediately
normative: >-
  Asynchronous execution MUST return the status `queued` to its caller immediately. It
  MUST NOT execute any node in the calling request. It MAY seed the run from a snapshot of
  already-completed work.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

