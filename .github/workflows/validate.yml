name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rules:
    name: rule corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate

  site:
    name: site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      # The site is generated from the rule corpus at build time, so a rule that
      # validates can still break the page that renders it. Nothing here is
      # published; the image is built separately, on main only.
      - run: npm run build
        working-directory: site
      - name: every ruling has a page
        run: |
          # The reasoning record is as much a part of the published document as the
          # rules are. For a while it existed only in an implementation's notes and
          # every citation rendered as a bare identifier; this is the check that
          # stops that returning quietly.
          rulings=$(ls rulings/*.yml | wc -l)
          pages=$(find site/out/rulings -mindepth 1 -name index.html | wc -l)
          echo "$rulings ruling(s), $pages page(s)"
          # One more than the rulings: the /rulings index itself.
          [ "$pages" -eq "$((rulings + 1))" ] || { echo "::error::$rulings rulings but $pages pages"; exit 1; }
          grep -q '^## Rulings' site/out/llms.txt || { echo "::error::llms.txt does not index the rulings"; exit 1; }
          grep -q '^# Rulings' site/out/llms-full.txt || { echo "::error::llms-full.txt omits the rulings"; exit 1; }

      - name: every rule has a page and a markdown twin
        run: |
          # Depth 3 is a rule page (rules/<family>/<rule>/index.html). Depth 2 is a
          # family index, of which there are 30, and counting those hides a shortfall.
          rules=$(ls rules/*.yml | wc -l)
          pages=$(find site/out/rules -mindepth 3 -name index.html | wc -l)
          # Two more than the rules: conventions and the glossary.
          md=$(find site/out/llms -name '*.md' | wc -l)
          echo "$rules rule(s), $pages page(s), $md markdown file(s)"
          [ "$rules" -eq "$pages" ] || { echo "::error::$rules rules but $pages rule pages"; exit 1; }
          [ "$md" -eq "$((rules + 2))" ] || { echo "::error::$rules rules but $md markdown files"; exit 1; }
          for f in site/out/llms.txt site/out/llms-full.txt site/out/rules.json \
                   site/out/robots.txt site/out/sitemap.xml; do
            [ -s "$f" ] || { echo "::error::$f is missing or empty"; exit 1; }
          done
          # The JSON feed is what a conformance tool reads, so a shape change that
          # empties it must fail here rather than downstream.
          node -e '
            const j = require("./site/out/rules.json");
            const n = '"$rules"';
            if (j.rules.length !== n) { console.error(`::error::rules.json has ${j.rules.length} rules, expected ${n}`); process.exit(1); }
            if (!j.reserved.length) { console.error("::error::rules.json lists no reserved identifiers"); process.exit(1); }
          '

      # The site is published under /spec. Next adds that prefix to its own links
      # but not to a string built by hand, so the two ways to get this wrong are a
      # doubled prefix and a missing one — and both live only in the
      # machine-readable surface, which nobody looks at.
      - name: absolute urls carry the base path exactly once
        run: |
          if grep -rl '/spec/spec' site/out; then
            echo "::error::a doubled base path is published; SPEC_ORIGIN already ends in /spec"
            exit 1
          fi
          if grep -rl 'spec\.flowdrop\.io' site/out; then
            echo "::error::spec.flowdrop.io has no DNS record and must not be published"
            exit 1
          fi
          # A spot check that the prefix is present at all, not merely un-doubled.
          node -e '
            const j = require("./site/out/rules.json");
            const bad = [j.source, ...j.rules.flatMap((r) => [r.url, r.markdown])]
              .filter((u) => !u.startsWith("https://flowdrop.io/spec"));
            if (bad.length) { console.error(`::error::${bad.length} url(s) miss the base path, e.g. ${bad[0]}`); process.exit(1); }
            console.log(`${j.rules.length * 2 + 1} url(s) in rules.json carry https://flowdrop.io/spec`);
          '

      # The schema's $id is an https URL, so it has to resolve to these bytes.
      - name: the rule schema is published at its own identifier
        run: node scripts/check-schema-published.mjs

  dco:
    name: sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: every commit carries Signed-off-by
        run: |
          missing=0
          for sha in $(git rev-list origin/${{ github.base_ref }}..HEAD); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::$sha is not signed off by $author"
              echo "  fix: git rebase --signoff origin/${{ github.base_ref }}"
              missing=1
            fi
          done
          exit $missing

  links:
    name: reference links
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: every reference url resolves
        run: |
          urls=$(grep -rhoE 'url: *https?://[^ ]+' rules/ | sed 's/url: *//' | sort -u)
          bad=0
          for u in $urls; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 20 "$u" || echo 000)
            if [ "$code" -ge 400 ] || [ "$code" = "000" ]; then
              echo "::warning::$u -> $code"
              bad=1
            fi
          done
          exit $bad
