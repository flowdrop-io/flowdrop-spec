id: SCH-7
family: GR-SCHEMA
part: I

title: An output is exposed unless the node type says otherwise

normative: >-
  A declared output MUST survive into a node's metadata unless the node type marks
  that output not exposed. Where the node type says nothing about it, the output MUST
  be exposed: the default is fail-open.

posture: normative-target
level: core
profiles:
  - storage-api
  - editor-client

