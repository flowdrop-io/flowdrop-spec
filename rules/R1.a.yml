id: R1.a
family: GR-VAL
part: I

title: A node's executor must exist

normative: >-
  A node whose node type resolves to an executor the implementation does not
  provide is refused with the error code `R1_PLUGIN_MISSING`. The verdict is
  reached from the executor's declaration alone; the executor is never
  constructed in order to decide it.

posture: normative-target
level: core
profiles:
