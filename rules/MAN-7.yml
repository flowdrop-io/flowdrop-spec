id: MAN-7
family: GR-MAN
part: I

title: Only a flat default is published
summary: >-
  A default is published so a caller knows what happens if they omit the input.
  Anything with nested structure is dropped rather than half-published, and the
  rest of the fragment survives the drop.

normative: >-
  A `default` survives into the published contract when it is null, a scalar, or a
  collection one level deep whose every member is null or a scalar, an empty
  collection included. A default of any other shape, including one with a nested
  value, is dropped and the drop is logged. Dropping a default never affects the
  rest of the fragment: every other contract key of that entry is retained.

posture: normative-target
level: extended
profiles:
  - storage-api

added: "1.0"
changed: "1.0"

