id: SG-14
family: RT-SG
part: II

title: Exceeding the iteration budget ends the run, it does not pause it

normative: >-
  A state update that would push the run's iteration count strictly past the
  configured maximum MUST end the run. The budget's own last iteration MUST be
  allowed; only exceeding the maximum ends the run. The run MUST then report
  status `max_iterations_exceeded` with no results, together with the configured
  maximum, the count reached, and the node that reached it. This is a terminal
  verdict and not a pause. The run MUST NOT offer a resume handle. The status
  MUST NOT be `paused`.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

