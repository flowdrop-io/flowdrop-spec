id: CFG-8
family: GR-CFG
part: I

title: Internal parameters take runtime values only

summary: >-
  Names prefixed `__` are the system's own channel into a processor. They sidestep
  the gate flags, which also means an author can never see or set one; choosing the
  prefix is choosing that semantics, not a naming style.

normative: >-
  A parameter whose name begins `__` is internal. An internal parameter MUST accept a
  value from the runtime inputs regardless of its `connectable`, `exposed` and
  `configurable` flags. It MUST NOT take a value from the node's saved configuration.
  Where the runtime inputs supply none, it MUST take its effective default. Bypassing
  the gate flags does not exempt it from declaration: an internal name absent from the
  processor's parameter schema MUST NOT be resolved, whoever supplied it. Such a name
  MUST NOT reach the processor (CFG-13). A setting that also needs an author-facing
  surface MUST NOT use the prefix.

posture: normative-target
level: core
profiles:
  - storage-api

