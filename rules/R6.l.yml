id: R6.l
family: GR-VAL
part: I

title: A malformed secret reference warns the author

summary: >-
  Writing `{{ secrets.NAME }}` instead of `${{ secrets.NAME }}` produces a
  literal string at execution rather than a secret, silently and with no error.
  The warning exists to catch the missing `$` while the author is still looking.

normative: >-
  A string in a node's `config` that contains `{{ secrets.` without the leading `$` MUST
  yield a warning at `node.{id}.config.{key}` telling the author to write `${{
  secrets.NAME }}`. The warning MUST also be yielded for a reference nested at any depth
  inside structured config. A correctly written `${{ secrets.NAME }}` MUST NOT produce
  the warning. The save MUST NOT be blocked either way.

posture: normative-target
level: extended
profiles:
  - storage-api
  - editor-client

added: "1.0"
changed: "1.0"

rulings:
  - OPEN-25
