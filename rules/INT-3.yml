id: INT-3
family: RT-INT
part: II

title: Resolving an interrupt resumes only a paused run

summary: >-
  Answering a question must never restart a run that is already moving. The reset
  and the resume are two steps in that order, which is what keeps two executors off
  the same run.

normative: >-
  Resolving an interrupt locates the job it interrupted by the job identifier
  stamped on the interrupt, and returns that job to pending unconditionally. Only
  then, and only if the run is paused, is the run resumed, through the engine the
  run declares (ORC-13), never a different one. A run that is not paused is left
  strictly alone and must not be re-entered. A stateless run has nothing to resume,
  and resolution is a no-op for it.

posture: normative-target
level: core
profiles:
  - runtime

