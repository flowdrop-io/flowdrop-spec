id: PLAY-3
family: RT-PLAY
part: II

title: The message poll has its own envelope, with the flags at the top level
summary: >-
  The three flags beside the data are what a polling client reads to decide
  whether to fetch again and whether the turn is over. Folding them into the
  shared pagination block would break every such client.

normative: >-
  The message poll MUST answer `{success, data, hasMore, hasOlder, sessionStatus}`,
  with no pagination block and no `has_more` key. The three flags MUST be siblings of
  `data`, not nested. `hasMore` MUST report page fullness (whether the page returned
  as many messages as were asked for); it is an inference. `hasOlder` MUST report
  whether messages older than the page exist; it is authoritative, so a client
  scrolling back never pays a speculative empty fetch at an exact page boundary.
  `sessionStatus` is carried so that a poller needs no second request to learn the
  turn has finished. The forward and backward cursors MUST be honoured only when they
  are strings of digits. A cursor that is not MUST be ignored, and MUST NOT cause the
  request to be refused.

posture: normative-target
level: core
