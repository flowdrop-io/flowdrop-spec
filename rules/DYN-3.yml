id: DYN-3
family: GR-DYN
part: I

title: Dynamic port names are constrained and unique across the node

normative: >-
  A dynamic port name MUST begin with an ASCII letter and continue with ASCII
  letters, digits or underscores. A dynamic port name MUST NOT be a reserved name.
  A dynamic port name MUST be unique across the union of the node's dynamic input and
  dynamic output names, so an input and an output on the same node cannot share a
  name. A definition that breaks any of these MUST be refused.

posture: normative-target
level: extended
profiles:
  - storage-api

added: "1.0"
changed: "1.0"

