id: INT-7
family: RT-INT
part: II

title: The workflow version is a structural digest

summary: >-
  Two implementations agree on whether a snapshot still fits its workflow because the version is computed the same way.
  Moving a node on the canvas is not a change to the workflow it snapshots.

normative: >-
  A workflow's version MUST be the first 16 hexadecimal characters of a SHA-256 digest
  over the workflow's structural data only. Presentational data (labels, canvas
  positions) MUST NOT change it.

posture: normative-target
level: extended
profiles:
  - runtime

