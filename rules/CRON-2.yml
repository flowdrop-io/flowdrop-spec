id: CRON-2
family: RT-CRON
part: II

title: Every reason a schedule has no next run carries a stable code
summary: >-
  The report of a trigger's next run is the only view of a schedule an operator
  has. A report that cannot distinguish "fine, nothing due" from "will never fire"
  is the diagnostic being absent exactly when it is needed.

normative: >-
  An absent next run, reported on its own, MUST mean only that nothing is currently
  due, the answer a perfectly healthy schedule gives between fires. Every other reason
  a schedule yields no next run MUST be reported with a stable code: `no_expression`
  where the expression is cleared, `invalid_expression` where it is malformed, or
  well-formed but unsatisfiable. Severity MUST NOT be flattened: an unusable timezone
  does not stop a trigger, since UTC is used in its place, so such a schedule MUST
  still report a real next run alongside the code `invalid_timezone`; an expression
  problem, being the more consequential of the two, MUST take its place. A broken
  stored schedule is not a broken request, so the report MUST be answered with 200. It
  MUST carry the diagnosis.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

