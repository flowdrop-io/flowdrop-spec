id: DATA-7
family: RT-DATA
part: II

title: Inside a node, a wire outranks configuration outranks the default

normative: >-
  Within a node, a value delivered on an input port MUST outrank the value the
  author configured on that node, which MUST outrank the port's schema default.
  Presence is decided key by key at every level, so an explicit `null` at a higher
  level MUST win over a value at a lower one.

