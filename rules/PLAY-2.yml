id: PLAY-2
family: RT-PLAY
part: II

title: Creating a session answers the same row the list publishes
summary: >-
  A client can insert a creation response straight into its list without
  re-fetching, which is what makes one shared row shape load-bearing rather than
  tidy.

normative: >-
  Creating a session answers `201` and reading one answers `200`, both under
  `{success, data}`, and in both cases `data` is exactly the row the session list
  publishes in its `data[]`: `id`, `workflowId`, `name`, `status`, `createdAt`,
  `updatedAt`, `metadata`, `executions`, `owner`, in that order. `owner` is
  exactly `{id, name}`. `createdAt` and `updatedAt` are ISO 8601 strings, never
  numeric timestamps. `executions` is an empty list, not null, for a session that
  has never run.

posture: normative-target
level: core
