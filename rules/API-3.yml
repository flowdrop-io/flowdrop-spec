id: API-3
family: GR-API
part: I

title: A session with no workflow is a conflict, not a server error

normative: >-
  A request against a session that has no associated workflow MUST be refused with 409
  on every endpoint that serves that session. It is a problem with the session's state,
  the same refusal family as a turn refused because one is already running. The
  response MUST carry a generic message. The detail that identifies the session goes to
  the log, and MUST NOT appear in the response body.

posture: normative-target
level: extended
profiles:
  - storage-api
  - runtime

