id: R8.a
family: GR-VAL
part: I

title: An edge's source node must exist

normative: >-
  An edge whose `source` does not name a node in the workflow MUST be refused with
  `R8_EDGE_SOURCE_MISSING` at `edge.{index}`, where `{index}` is the edge's position in
  the workflow's edge list. An absent `source` names no node, and neither does an empty
  one.

posture: normative-target
level: core
profiles:
  - storage-api

