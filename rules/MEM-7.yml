id: MEM-7
family: GR-MEM
part: I

title: A refused scope reaches no storage backend
summary: >-
  The refusal is only worth having if every consumer honours it identically, and
  if nothing is written on the way out.

normative: >-
  When a memory scope refuses, every consumer of it MUST return its neutral result
  and MUST NOT call the storage backend, for either a read or a write-back. A read
  MUST return its configured default and MUST report that nothing was found. A
  write and a delete MUST report failure. A conversation-buffer append MUST return
  an empty buffer with a count of zero, and MUST drop the turn rather than append
  it to a shared history. The resolved scope identifier reported back MUST be
  empty. Each refusal emits exactly one warning identifying the node, the pipeline
  and the workflow. The refusal is decided in one place, so the consumers cannot
  diverge.

posture: normative-target
level: core
profiles:
  - storage-api
  - runtime

added: "1.0"
changed: "1.0"

