id: CFG-1
family: GR-CFG
part: I

title: An unrecorded gate flag is off

summary: >-
  A node type records per-parameter gate flags: whether a parameter can receive a
  wire, whether it appears in the config form, whether it is required. Where a flag
  was never recorded, the answer is no.

normative: >-
  A parameter's `connectable`, `configurable` and `required` gate flags MUST
  default to false. Where a node type records no value for one of them, the
  parameter MUST be treated as not connectable, not configurable, or not required
  accordingly. Where a node type records one of these flags, or `exposedByDefault`
  (CFG-2), the value MUST be a JSON boolean; a node type that records any other
  value for one of them, `null` included, cannot be built (SCH-24).

posture: normative-target
level: core
profiles:
