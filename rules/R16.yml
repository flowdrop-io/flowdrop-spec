id: R16
family: GR-VAL
part: I

title: No edge targets a trigger node's event input
summary: >-
  A trigger's event comes from whatever started the run, never from another node. An
  edge into the port would replace the event with a value from inside the workflow,
  because a delivered edge value outranks initial data (DATA-6).

normative: >-
  An edge whose target is the `event` input port (SCH-47) of a node whose node type is
  a trigger node type MUST be refused with `R16_EDGE_EVENT_INPUT` at `edge.{index}`.
  An authoring surface MUST NOT produce such an edge.

posture: normative-target
level: extended
profiles:
  - storage-api
  - editor-client

added: "1.0"
changed: "1.0"

