id: CMP-7
family: RT-CMP
part: II

title: Trigger dependencies displace data dependencies for ordering
normative: >-
  Where a node has both trigger dependencies and data dependencies, its execution
  dependencies MUST be its trigger dependencies alone. Data dependencies MUST NOT
  order a node that has a trigger dependency.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

rulings:
