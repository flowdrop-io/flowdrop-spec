id: MAN-16
family: GR-MAN
part: I

title: The value check enforces type and enum, and declares the rest
summary: >-
  A published contract says more than the launch boundary enforces. That is a real
  distinction and worth stating, so a caller does not read an unenforced keyword
  as a guarantee.

normative: >-
  The per-value stage of the launch check MUST enforce `type` and `enum` from a
  contract fragment and no other key. The set is closed, so that a caller can tell
  from the contract which published keys can refuse a launch. Every other published
  key (`format`, `default`, `minimum`, `maximum`, `minLength`, `maxLength`, `pattern`,
  and nested `properties` or `items`) is declared in the contract and MUST NOT be enforced here.
  A `type` that is not a single string MUST NOT be enforced here either. The top-level
  array of required names is the one other declared key that is enforced, and the
  earlier missing-input stage MUST enforce it. Values MUST NOT be coerced. For every
  structured type, the check MUST be only that the value is a collection. A type
  meaning "any value" MUST waive the type check entirely, and MUST match every value,
  including null and a collection. `enum` MUST still be honoured for such a type. Such
  types are declared no-constraint types, and a boundary that refused what the runtime
  accepts would give a port's declared type two meanings. `enum` MUST compare by
  identity, so a number and its string spelling are different values. Violations
  across several inputs MUST be aggregated into one refusal. An input with no contract
  fragment MUST skip the value check.

