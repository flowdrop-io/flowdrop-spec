id: R13
family: GR-VAL
part: I

title: Two identical edges between the same ports are refused

summary: >-
  Duplicate detection compares what the document literally says, not what it
  means. Two spellings of the same logical connection are therefore two
  distinct edges, and both are kept.

normative: >-
  Two edges are duplicates when their `source`, `target` and both handle
  strings are identical. A duplicate is refused with
  `R13_EDGE_PARALLEL_DUPLICATE` at `edge.{index}`, and the error names the
  position of the earlier edge it duplicates. The four values are compared
  verbatim, with no parsing or normalisation of a handle into a port name, so
  two edges between the same pair of nodes over different ports stay valid, and
  two edges over the same logical port written differently (one with the
  handle omitted, one with it spelled out) are both accepted. An edge with an
  empty endpoint takes no part in the comparison.

posture: normative-target
level: core
profiles:
