id: SG-17
family: RT-SG
part: II

title: A loop's extent is fixed at launch and every execution carries its rounds

normative: >-
  A run MUST compute its loops once, when it starts. It MUST work from that
  result for the rest of its life, so an author editing the workflow cannot
  redraw the body of a loop that is already several rounds deep. Alongside the
  bodies, the run MUST record for each body node the set of nodes that can reach
  it over the forward graph, the node itself included. That set MUST NOT be
  restricted to the loop's body, because a node outside a loop can legitimately
  be an ancestor of one inside it, and a restricted set would report that
  nothing can still produce a value while such an input was still on its way.
  Every execution of every node MUST carry a stamp of the rounds it belongs to,
  with one entry per loop, including round 0, and an empty stamp for a node in
  no loop, so that an absent stamp cannot mean "outside every loop" and "inside
  one at round 0" at the same time. When a paused run resumes, its round
  counters MUST be rebuilt by replaying those stamps in creation order, newest
  winning. They MUST NOT be rebuilt by taking the highest round recorded for a
  loop, which is the high-water mark of some earlier outer round and would spend
  an inner loop's budget before the current outer round had begun.

