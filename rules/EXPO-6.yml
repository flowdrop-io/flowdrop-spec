id: EXPO-6
family: GR-EXPO
part: I

title: A processor's exposure suggestion is authoring input only

summary: >-
  Withdrawn (OPEN-33): how an implementation arrives at a port's stated default exposure is its own business.

normative: >-
  A processor's exposure suggestion was consumed at authoring time only. The
  specification no longer defines the suggestion: what a node type states is all a
  reader sees (CFG-2).

