id: STORE-5
family: GR-STORE
part: I

title: A workflow refused by validation is never partially stored

normative: >-
  A workflow that fails validation on create or on update MUST be refused with 422
  carrying `success: false`, a human-readable `error`, and `details`, an array of `{code,
  message, locator}` entries. `details` MUST carry one entry per error, each `locator`
  naming the position in the submitted workflow the error is about. Only errors refuse and
  only errors are reported. A workflow carrying warnings alone MUST be stored, and its
  warnings MUST NOT appear in the response. Create and update MUST refuse identically. A
  refused update MUST leave the stored workflow untouched.

posture: normative-target
level: core
profiles:
  - storage-api

added: "1.0"
changed: "1.0"

