id: MAN-14
family: GR-MAN
part: I

title: Strictness polices the caller, never the stored manifest
summary: >-
  A caller can fix the key they sent. They cannot fix a manifest entry someone
  else stored, so failing their launch over it helps nobody.

normative: >-
  A malformed manifest entry (MAN-8) MUST be dropped while resolving launch inputs,
  including where undeclared caller keys are refused. A warning is logged for it. An
  unbound entry is not malformed: its input is declared, and a caller MAY supply it
  (MAN-11). Strictness MUST apply to what the caller supplied. It MUST NOT apply to what
  the workflow stored.

posture: normative-target
level: extended
profiles:
  - storage-api

