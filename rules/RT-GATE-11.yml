id: RT-GATE-11
family: RT-GATE
part: II

title: A gated node whose executor cannot be resolved never executes

summary: >-
  Fail-closed here means error, not ask. Reading a missing executor as "no side
  effects" silently ungates the node; asking about a call that can never run trains
  operators to rubber-stamp.

normative: >-
  Where a node's confirmation requirement is derived from its executor and that
  executor cannot be resolved (no such executor is defined, or its implementation is
  unavailable), the node MUST NOT execute. It MUST NOT raise a confirmation prompt.
  The derivation fails, and the node MUST fail as any node with an unresolvable
  executor does. An implementation MAY elsewhere let callers probe an executor's
  declarations without raising, treating an unresolvable one as declaring nothing.
  That leniency MUST NOT be used at the gate, where it would read a missing executor
  as harmless.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

