id: ERR-13
family: RT-ERR
part: II

title: Every execution strategy routes errors identically
summary: >-
  A workflow that handles its own failures means the same thing whichever engine
  runs it, including the direct synchronous one.

normative: >-
  All execution strategies MUST route error outputs the same way. Where the failing
  node has an error edge, its outputs MUST be replaced by the shared error envelope
  and the run MUST continue. Where it has none, the run MUST fail. A strategy MUST NOT
  substitute its own error-handling behaviour.

posture: normative-target
level: core
profiles:
  - runtime

