id: ORC-15
family: RT-ORC
part: II

title: A cancelled run is announced like any other terminal outcome
summary: >-
  Cancellation leaves the run through its own path, so it is easy to forget to announce.
  Anything watching for a run to finish sees a cancelled run finish.

normative: >-
  Every path that cancels a run MUST announce the run's completion carrying the status
  cancelled, with the run's identity and its duration. The announcement MUST be made
  exactly once per cancellation. Consumers of that announcement MUST treat cancelled as
  its own outcome and MUST NOT treat it as a completed run. A cancelled sub-workflow MUST
  resolve to its caller with status cancelled and empty outputs.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

