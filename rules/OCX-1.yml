id: OCX-1
family: RT-OCX
part: II

title: External invocation builds flat initial data
summary: >-
  Replaced by MAN-26: a firing delivers its event on the trigger node's reserved input, through the ordinary launch mapping.

normative: >-
  The initial data for an externally invoked run is flat: the extracted trigger
  data at the top level, plus the identifiers of the trigger configuration and
  the trigger node, the same shape every other trigger kind builds. Since a
  trigger emits its whole initial data as the node's `data` output, the caller's
  payload is reachable at `data.payload`, which is what the trigger's declared
  output schema advertises. The initial data must not be keyed by node id.

posture: withdrawn
