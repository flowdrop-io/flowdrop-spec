id: DYN-6
family: GR-DYN
part: I

title: Dynamic ports carry no exposure state and are not addressable from outside
summary: >-
  Exposure is a property of a port the processor declares. A dynamic port is not
  declared, so there is nothing to hide and nothing to strip, and for the same
  reason nothing an outside caller can name.

normative: >-
  A dynamic port has no exposure. A dynamic port MUST always be wireable. The value
  of a dynamic port MUST NOT be stripped from a node's output. Edge validation MUST
  NOT raise an exposure objection against a dynamic port. For the same reason a
  dynamic port is not addressable at the workflow boundary: a launch-input manifest
  entry naming one MUST be refused, because the port is not declared by the node's
  processor.

posture: normative-target
level: extended
profiles:
  - storage-api
  - runtime

