id: RT-TOOL-10
family: RT-TOOL
part: II

title: A tool-calling pass reports whether it did any work

summary: >-
  An all-repeat pass returns a full list of tool messages and a successful outcome
  while having invoked nothing, so an agent loop gated on "messages non-empty"
  re-enters forever. This is the port that answers the question directly.

normative: >-
  A node that invokes tools MUST report `executed_any`, a boolean. It MUST report
  `executed`, an array of the call identifiers behind it, the complement of the
  `skipped` array. `executed_any` MUST be true when at least one call was handled
  for the first time in this run. A call naming a tool that is not wired MUST
  count as handled for the first time: nothing was invoked, but the recoverable
  "not an available tool" result is new, and the model re-plans against it. An
  empty batch MUST report false. The two arrays partition only the calls that reach
  the guard. A call with no identifier MUST appear in neither array and MUST set
  `executed_any`. A malformed call (one that is not a map, or whose name is blank
  or not a scalar) MUST be dropped before the guard, appear in neither array, and
  leave `executed_any` false. `executed_any` MUST be exposed by default.
  `executed` MUST NOT be exposed by default.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

rulings:
