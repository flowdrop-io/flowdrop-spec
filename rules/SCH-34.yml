id: SCH-34
family: GR-SCHEMA
part: I

title: A property's type is a JSON Schema type, not a port lane
summary: >-
  The two vocabularies overlap on four words, so a lane name written into `type`
  looks correct. Treating it as a broken schema makes the mistake show at once,
  not later as a port of the wrong lane.

normative: >-
  A property's `type` MUST be one of JSON Schema's seven type words, or an array
  whose every member is one. A port lane that is not one of those words, such as
  `json` or `mixed`, MUST NOT appear in `type`, on the input side or the output
  side. A schema that names one there fails the 2020-12 meta-schema, so its node
  type cannot be built and SCH-24 applies.

posture: normative-target
level: core
