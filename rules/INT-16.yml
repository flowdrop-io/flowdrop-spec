id: INT-16
family: RT-INT
part: II

title: A refused signal says why in a code a client can act on

summary: >-
  Three different refusals share one status code, and a client has to tell them
  apart to say anything useful to an operator. The discriminator is a stable code,
  not the wording of a message.

normative: >-
  The signal API MUST refuse in three distinguishable ways, all with `409`, each
  carrying a stable machine-readable code beside its human-readable message: the run
  is in a terminal state and cannot be signalled or resumed (`PIPELINE_TERMINAL`); an
  inward signal is already pending for the run (`INWARD_SIGNAL_ALREADY_PENDING`); and
  there is no active pause to resume (`NO_ACTIVE_PAUSE`). A client can classify a
  refusal by that code; the message wording is not a contract and an implementation
  MAY change it. A refusal MUST answer with the error envelope (API-1). A newly
  created cancel or pause signal MUST be answered `202`. A resume that resolved a
  pending pause MUST be answered `200`. A signal addressed to a run that does not
  exist MUST be answered `404` for a caller holding blanket authority over runs
  (existence is no secret from someone who can act on any run). For every other caller
  it MUST be answered with an opaque `403`, indistinguishable from the answer for a
  run that exists but is not theirs, so that the route cannot be used to enumerate
  which runs exist.

