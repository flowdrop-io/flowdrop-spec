id: R1.b
family: GR-VAL
part: I

title: A node with no resolvable node type is not judged by R1

summary: >-
  Nodes that carry no node type anchor at all (notes and other non-executable
  decoration) are legitimate, and are never refused for having no executor.

normative: >-
  R1 MUST NOT refuse a node that carries no node type anchor, or whose anchor does not
  resolve to a node type. A node anchored to an unknown node type MUST be refused by R9
  instead. A node with no anchor at all MUST NOT be refused for having none.

posture: normative-target
level: extended
