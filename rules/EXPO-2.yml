id: EXPO-2
family: GR-EXPO
part: I

title: An instance override decides exposure; otherwise the default does

normative: >-
  A node instance's overrides MUST be stored as `data.config.ports.inputs` and
  `data.config.ports.outputs`, each an array of entries naming a port by `id`; an
  entry MUST be matched by `id` within its own direction, so an input and an output of
  the same name never share one. Where the instance's entry for a port carries an
  `exposed` key, that key's value MUST be the port's exposure. Where there is no such entry,
  or the entry carries no `exposed` key, the port's default exposure MUST decide
  (`exposedByDefault`, CFG-2).

posture: normative-target
level: core
profiles:
