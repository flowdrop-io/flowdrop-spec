id: CFG-16
family: GR-CFG
part: I

title: The unified input port is decomposed before resolution

summary: >-
  A node can take all its inputs as one bundled object on the reserved `input`
  port. That bundle is unpacked into individual named inputs before any parameter
  is resolved, so the rest of the chain cannot tell the difference.

normative: >-
  Where the reserved `input` port carries a value, it MUST be decomposed before any
  parameter is resolved. Where that value is not an object, it MUST NOT be decomposed:
  the runtime inputs MUST be left unchanged. The raw `input` key MUST survive, so that a
  declared parameter literally named `input` receives the value as it stands. Otherwise,
  only keys that name a connectable parameter, an internal parameter, or a declared
  dynamic input MUST be kept, and the rest MUST be discarded. A value wired individually
  to a port MUST overwrite the same key taken from the bundle.

posture: normative-target
level: extended
profiles:
