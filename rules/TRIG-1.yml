id: TRIG-1
family: RT-TRIG
part: II

title: Overlap is judged against the workflow's own unfinished runs
summary: >-
  The overlap decision is made unattended, and a wrong answer is either a
  duplicated production run or a silently dropped one. The four policies are four
  genuinely different behaviours, and the buffer is a one-slot mailbox rather than
  a queue.

normative: >-
  Overlap MUST be decided against runs of the same workflow that have not
  reached a terminal state: pending, running or paused. A terminal run, and a
  run of any other workflow, MUST be ignored. With none active, every policy
  MUST proceed with the caller's trigger data unchanged. With one active, Skip
  MUST block the firing. With one active, Buffer MUST defer the firing and block
  it. With one active, Cancel MUST cancel every active run and announce each
  cancellation. With one active, Cancel MUST then proceed. With one active,
  Terminate MUST first cancel every job those runs still have outstanding, so no
  worker can pick one up after the run is gone. With one active, Terminate MUST
  then do what Cancel does. The buffer MUST hold at most one deferred firing per
  trigger. A second firing that arrives while one is buffered MUST be dropped,
  neither stacked nor overwriting the buffered one. A buffered firing MUST be
  released at the next firing once the run that blocked it is terminal or gone.
  On release, the buffered firing's own payload MUST replace the current
  firing's. A buffer whose blocking run can no longer be identified MUST be
  released rather than left stranded. A policy an implementation does not
  recognise MUST be treated as Skip, the only fail-safe direction, since every
  alternative destroys a running workflow.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

