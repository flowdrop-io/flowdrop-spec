id: STORE-11
family: GR-STORE
part: I

title: Status vocabularies are closed sets of strings

normative: >-
  Job, pipeline, session and message status MUST each take their value from a closed
  vocabulary. A status MUST be a string, and one spelling MUST serve everywhere: what is
  persisted is what every JSON payload carries and what every event carries. An
  implementation MUST NOT persist one spelling and publish another.

posture: normative-target
level: extended
profiles:
  - storage-api
  - runtime

added: "1.0"
changed: "1.0"

rulings:
  - OPEN-25

related:
  - STORE-12
