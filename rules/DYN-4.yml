id: DYN-4
family: GR-DYN
part: I

title: An unconnected dynamic input is absent from the resolved inputs

normative: >-
  A dynamic input port with nothing wired into it MUST be absent from the node's
  resolved inputs. A `null` delivered on its wire MUST be present with the value `null`.
  Nothing arriving on the wire is not the same as a `null` arriving.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

