id: DATA-12
family: RT-DATA
part: II

title: Tools reach only a node that declares itself a tool consumer

normative: >-
  Tools MUST NOT be handed to a node unless its node type declares that it consumes
  them. Wiring tools to a node type that neither consumes nor forwards them MUST be
  a validation error. Wiring tools to a node type that forwards them MUST be
  accepted, and the node MUST pass them on. If such a workflow runs regardless, the
  node MUST receive no tools. A node re-entered on a later round of a loop MUST
  receive its tools on every round.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

