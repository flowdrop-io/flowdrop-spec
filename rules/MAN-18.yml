id: MAN-18
family: GR-MAN
part: I

title: The contract is rebuilt when the manifest changes, and versioned when it is
summary: >-
  Rebuilding is triggered by the manifest, not by the schemas underneath it, so a
  caller reads a contract that was published deliberately rather than one that
  drifts.

normative: >-
  A workflow's contract MUST be rebuilt when its declared input or output manifest
  differs from the stored one, or when a rebuild is forced. A change inside a bound
  port's own schema MUST NOT trigger a rebuild, so the published contract stays as it
  was until something else rebuilds it. A side with no declared entries MUST store no
  schema for that side. On rebuild the contract version is bumped as follows. From an
  all-zero version, any of a major, minor or patch bump MUST yield the first released
  version. Otherwise the named digit MUST be incremented and the lower digits MUST be
  reset. A rebuild that bumps nothing MUST write the schemas. It MUST leave the
  version untouched. A build that fails MUST preserve the previously published
  contract, and an error is logged. A failed build MUST NOT prevent the workflow from
  being saved.

posture: normative-target
level: extended
profiles:
  - storage-api

added: "1.0"
changed: "1.0"

