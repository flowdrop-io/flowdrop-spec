id: LANG-17
family: GR-LANG
part: I

title: Dot and bracket path segments are interchangeable everywhere

normative: >-
  A property path written with dot segments, bracket segments, or a mixture of the two
  MUST be accepted. An implementation normalizes them to a single form before parsing. Every
  place an implementation reads a property path MUST resolve the two spellings
  identically.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

rulings:
  - OPEN-25
