id: LANG-21
family: GR-LANG
part: I

title: A failed mapper expression fails the node and names the port

normative: >-
  When the expression for a mapper output fails, the node fails, the failure names
  the output port whose expression failed, and no partial output map is produced.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

related:
