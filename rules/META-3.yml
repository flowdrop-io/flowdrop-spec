id: META-3
family: RT-META
part: II

title: A failed read answers a fixed message and reports the real one
summary: >-
  An error message passed through verbatim can publish internals, such as a
  failed query or the name of a component, to any caller who can read the
  resource.

normative: >-
  Where a read fails, the response body MUST carry a fixed message naming what
  failed and nothing more. The underlying error MUST NOT be published to the
  caller; the implementation reports it through its own error channel. A cacheable
  response MUST meet this as every other kind does: an error shape is not exempt
  because it is served from a different response path.

posture: normative-target
level: extended
profiles:
