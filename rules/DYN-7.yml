id: DYN-7
family: GR-DYN
part: I

title: Dynamic port definitions are configuration, never a wireable input port

normative: >-
  The reserved parameter holding a node's dynamic port definitions MUST NOT be a
  wireable input port. It MUST NOT appear in the node's configuration schema unless
  the node type marks it configurable. Where it appears there, its value MUST come
  from the node type's default, else the parameter's schema default, else the empty
  array. Without that opt-in it MUST appear in neither the configuration schema nor
  the input schema, and the node's dynamic port definitions MUST resolve to empty.
  Stored definitions do not survive an opt-out.

posture: normative-target
level: extended
profiles:
  - storage-api
  - editor-client

added: "1.0"
changed: "1.0"

rulings:
