id: EXPO-11
family: GR-EXPO
part: I

title: Output stripping covers every output port the node has

summary: >-
  Hiding an output means its value never leaves the node. The pass that enforces
  this works from the node's effective output schema, dynamic outputs included;
  reserved control ports are not in that schema and are outside its reach.

normative: >-
  When a node execution produces a result, every key naming an output port of the
  node's effective output schema (DYN-8), dynamic outputs included, that resolves
  as hidden MUST be removed from that result before it is delivered anywhere. A
  key the effective output schema does not declare MUST pass through untouched,
  and so MUST the reserved control outputs whether declared or not (EXPO-12). A
  hidden output MUST be stripped whatever else the result contains, even where the
  processor declares no output ports at all.

posture: normative-target
level: core
profiles:
