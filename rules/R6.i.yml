id: R6.i
family: GR-VAL
part: I

title: A null config value is present and skips the schema checks

normative: >-
  A config value of `null` is present, with no value. It MUST satisfy a required key. No
  schema constraint MUST be evaluated against it, so a `null` MUST NOT fail type,
  `enum`, bounds or `pattern`. This is the save-time side of the parameter exception
  that CFG-10 states for a run.

posture: normative-target
level: core
