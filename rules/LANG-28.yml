id: LANG-28
family: GR-LANG
part: I

title: A condition node's operators are a closed set, and case folding spares the pattern

normative: >-
  A condition node MUST compare with a closed set of six operators, `equals`,
  `not_equals`, `contains`, `starts_with`, `ends_with` and `regex`, and no others. The
  operators MUST be declared as an enumeration. A workflow naming an operator outside
  that set MUST be refused when it is saved. It MUST be refused again when the parameter
  is resolved. An operator that reaches execution outside the set MUST fail the node. A
  pattern that cannot be compiled MUST fail the node when it runs. Where the comparison
  is case-insensitive it is performed case-insensitively. For `regex` the pattern text
  MUST NOT be rewritten: case insensitivity MUST be applied as the regular-expression
  engine's own case-insensitive mode, so every escape the author wrote keeps the meaning
  they gave it and a pattern written to match non-digits does not come to match digits.
  A character class in the pattern MUST fold along with the rest of the comparison,
  because that is the case-insensitive comparison the author asked for.

posture: normative-target
level: core
profiles:
  - storage-api
  - runtime

added: "1.0"
changed: "1.0"

