id: LANG-18
family: GR-LANG
part: I

title: A trigger mapping value can be escaped as a literal

normative: >-
  In a trigger mapping, a value prefixed `literal:` or wrapped in matching single or
  double quotes MUST be taken as the literal string it spells. It MUST NOT be extracted
  from the context. The escape MUST NOT apply outside trigger mappings.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

rulings:
  - OPEN-25
