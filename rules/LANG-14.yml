id: LANG-14
family: GR-LANG
part: I

title: A leading `$` decides JSONPath from property path

normative: >-
  A path MUST be treated as a JSONPath query if and only if the string, once trimmed of
  surrounding whitespace, begins with `$`. Every other path MUST be treated as a
  property path.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

rulings:
  - OPEN-25
