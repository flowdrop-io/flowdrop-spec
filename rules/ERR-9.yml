id: ERR-9
family: RT-ERR
part: II

title: A run whose every failure was handled completes
summary: >-
  The verdict is computed from unhandled failures, not from failures. One unrouted
  failure fails the run no matter how many routed ones accompany it.

normative: >-
  A run MUST finish with status completed when every failed unit of work in it carries
  the error-routed marker. A run MUST fail when any failed unit of work does not carry
  it. A routed failure MUST still be announced on the ordinary "unit of work finished"
  channel, so subscribers see it and discriminate on its status. A failed tool
  invocation MUST always count as handled: a tool failure is delivered to its consumer
  as a recoverable result.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

