id: META-7
family: RT-META
part: II

title: A conditional schema request is exact string equality and nothing more
summary: >-
  A partial wildcard implementation would report "unchanged" to a client that
  holds no copy at all, which is worse than answering unconditionally.

normative: >-
  `If-None-Match` on a workflow schema read MUST be compared for exact string
  equality against the tag of the variant being requested. A match MUST answer
  `304` carrying the entity tag. The body of that `304` MUST be `{}`. A match is
  answered before the schema itself is assembled. A mismatch MUST answer the full
  `200`. The wildcard `*`, a comma-separated list of tags and weak comparison are
  not supported: a request sending any of them MUST receive the full `200`. Each
  variant MUST answer its own conditional request, so carrying the variant in the
  tag costs no variant a `304`.

posture: normative-target
level: extended
profiles:
