id: ORC-14
family: RT-ORC
part: II

title: A unit of work is claimed atomically
summary: >-
  Without this, two workers can promote and execute the same unit of work, and a
  side-effecting node fires twice.

normative: >-
  Claiming a unit of work for execution MUST be atomic with respect to other workers. A
  unit of work MUST NOT be executed twice because two workers claimed it concurrently.
  Queueing a run for execution MUST NOT deliver the same work twice.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

rulings:
