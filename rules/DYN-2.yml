id: DYN-2
family: GR-DYN
part: I

title: A dynamic port declares a name, a label and a data type

normative: >-
  Every dynamic port definition MUST carry a `name` and a `label`, and can carry a
  `dataType`. A definition with no `dataType` MUST be read as `mixed`. An authoring
  surface MUST NOT produce a definition whose `dataType` is a control lane, because a
  dynamic port carries a value by definition.

posture: normative-target
level: extended
profiles:
