id: MAN-20
family: GR-MAN
part: I

title: The API maps a client interface onto the stored manifest
summary: >-
  What an editor calls an interface entry and what the server stores as a manifest
  entry are the same thing under two vocabularies. This is the mapping, including
  what it deliberately ignores.

normative: >-
  A workflow's API MUST accept an `interface` object. It MUST map the object onto the
  stored input and output manifests. An entry's client-side identifier MUST become the
  server-side input name; renaming either is a breaking change for callers. An entry
  carries at most one binding, whose node and port identifiers MUST become the entry's
  `node_id` and `port`. An entry carrying more than one binding MUST be refused with
  400. The request MUST store nothing. An entry carrying no binding MUST be stored as an
  unbound entry (MAN-2), and MUST NOT be an error. An entry's declared schema MUST be
  stored as the entry's `schema`, and its declared data type as that schema's `x-data-
  type`. A default value and free-form metadata on an entry MUST be ignored on write,
  because they have no server representation. Input-side author metadata (the entry's
  display name, description, examples and required flag) MUST round-trip as author-
  written manifest metadata does. An output entry carries its name, its declared type
  and schema, and its binding where it has one, and none of the input-side metadata. On
  read, an unbound entry MUST be published with an empty list of bindings. The mapped
  manifests MUST be applied before the workflow is validated. A bound entry naming a
  node or port that does not exist MUST be refused with 422 by workflow validation. The
  API's own 400 refusals MUST cover the entry's shape only.

posture: normative-target
level: extended
profiles:
