id: API-4
family: GR-API
part: I

title: Node configuration could be checked ahead of save
summary: >-
  Withdrawn: save-time validation is the only verdict on a node's configuration (R6, R11). See the legacy appendix.

normative: >-
  A node's configuration could be checked ahead of save, by submitting the configuration
  on its own to a per-node-type validation endpoint. That surface is withdrawn: judging a
  configuration without the node's edges reports problems the save path accepts, and
  save-time validation is the one surface that issues a verdict on a node's
  configuration.

posture: withdrawn
level: optional
