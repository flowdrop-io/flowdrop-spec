id: CFG-2
family: GR-CFG
part: I

title: An unstated default exposure means exposed

summary: >-
  A port nobody has decided about is visible, so it does not silently vanish from the
  canvas. This is the one place the fallback is stated; every rule that resolves
  exposure reaches it through EXPO-2.

normative: >-
  Where a node type states no `exposedByDefault` for a port it declares, or a dynamic
  definition states none for the port it adds (DYN-2), the port MUST be exposed by
  default. This is the opposite polarity to the gate flags (CFG-1), deliberately.

posture: normative-target
level: core
profiles:
  - storage-api

added: "1.0"
changed: "1.0"

