id: CFG-14
family: GR-CFG
part: I

title: A parameter is present exactly when a priority supplied it

normative: >-
  A declared parameter MUST be present in the resolved parameter set when a priority
  supplied it (CFG-4 to CFG-6), with the value that priority supplied, a `null`
  included. A parameter that no priority supplied MUST be absent from the set. It MUST
  NOT be present with the value `null`, so a `null` in the set always means that a
  priority chose it.

posture: normative-target
level: core
profiles:
  - storage-api

added: "1.0"
changed: "1.0"

