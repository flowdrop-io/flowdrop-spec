id: ORC-3
family: RT-ORC
part: II

title: An unknown strategy identifier falls back, and says so
normative: >-
  A request for a strategy identifier the implementation does not know falls back to
  the default strategy and records a warning. Where no fallback strategy is available
  either, the request fails rather than silently choosing one.

posture: normative-target
level: extended
profiles:
  - runtime

