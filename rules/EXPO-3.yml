id: EXPO-3
family: GR-EXPO
part: I

title: Overrides are scoped by direction

normative: >-
  Exposure overrides MUST be scoped by port direction: an output port's override
  MUST be read from the `outputs` array, and an input port's (that of every other
  direction) MUST be read from the `inputs` array, each entry matched by its `id`. An input and an output of the same
  name are separate ports. An override on one MUST NOT apply to the other.

posture: normative-target
level: core
profiles:
  - storage-api

added: "1.0"
changed: "1.0"

