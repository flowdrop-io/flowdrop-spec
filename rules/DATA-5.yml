id: DATA-5
family: RT-DATA
part: II

title: Loopback and tool edges create no execution dependency

normative: >-
  An edge into the reserved `loop_back` input port, and an edge that wires a tool to
  a consumer, MUST NOT create an execution dependency. The check for circular
  dependencies MUST NOT consider either kind of edge, and neither MUST the
  evaluation of a node's readiness. A node whose only incoming edges are of those two
  kinds MUST therefore be ready at once. For tool edges this is required rather than
  convenient: a tool node never becomes a unit of execution, so it can never
  complete, and a tool edge that gated its consumer would starve it forever.

posture: normative-target
level: core
profiles:
  - runtime

