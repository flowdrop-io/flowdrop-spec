id: LANG-21
family: GR-LANG
part: I

title: A failed mapper expression fails the node and names the port

normative: >-
  When the expression for a mapper output fails, the node MUST fail. The failure MUST
  name the output port whose expression failed. The node MUST NOT produce a partial
  output map.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

rulings:
  - OPEN-25

related:
