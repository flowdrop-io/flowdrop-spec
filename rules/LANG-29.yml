id: LANG-29
family: GR-LANG
part: I

title: An expression error fails the node; an empty result does not
summary: >-
  One policy across every node that evaluates an author's expression, so a broken
  expression is visible and routable rather than silently absorbed.

normative: >-
  An expression error (a path the engine cannot evaluate, a failure raised by the
  engine) MUST fail the node. The failure MUST route to the error edge. This MUST hold
  uniformly across every node that evaluates an author's expression. An expression that
  evaluates cleanly and finds nothing is not an error, so an extractor's
  default-on-no-match is unaffected. Leniency toward genuine errors MUST NOT occur
  except through an explicit, opt-in node configuration.

posture: normative-target
level: core
profiles:
  - runtime

