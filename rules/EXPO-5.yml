id: EXPO-5
family: GR-EXPO
part: I

title: Only an exact false suppresses default exposure

summary: >-
  The schema extension that suggests hiding a port is read by identity, not by
  truthiness. Anything that is not the boolean false leaves the port exposed, so a
  malformed or half-migrated value fails towards visible.

normative: >-
  A processor's `x-exposed-by-default` schema extension MUST suppress a port's default
  exposure when its value is exactly the boolean `false`. Any other value
  (including null, zero, an empty string, or the string `"false"`) MUST leave the port
  exposed by default, as does the key's absence (CFG-2).

posture: normative-target
level: core
profiles:
