id: DYN-8
family: GR-DYN
part: I

title: A node's ports are its effective schemas, with dynamic ports overlaid
summary: >-
  A dynamic port definition is configuration that adds one property to the node's
  input or output schema. Once it is overlaid, the port is a port like any other, and
  no rule needs to say anything special about it.

normative: >-
  A node's ports MUST be read from its effective schemas: the node type's parameter
  schema overlaid with the node's `dynamicParameters`, and its output schema overlaid
  with its `dynamicOutputs`. Each definition MUST add one property named after it. Where the definition
  carries a `schema` (DYN-2), the property MUST be that schema. Otherwise the property
  MUST carry the definition's lane in `x-data-type`, and the JSON Schema `type` that
  lane stands for: `string`, `number`, `boolean` and `array` for the lanes of those names, `object`
  for `json`, and no `type` for `mixed`. Where the lane is a shape, the property MUST
  carry the shape's own top-level `type` where the shape declares one, and nothing more
  of the shape (SCH-42). A property the node type declares MUST win over a definition
  of the same name (DYN-5). An overlaid parameter MUST take the gate flags its
  definition carries (DYN-2), and the derived input and config schemas MUST split it as
  any parameter (SCH-3, SCH-6). An overlaid port's default exposure MUST be its definition's `exposedByDefault` (DYN-2). The overlay MUST be computed from the node's stored definitions wherever a
  node's ports are read: at save, when the node is enriched, when a contract is built
  and when the node runs. It MUST NOT be computed from a value delivered at run time
  (DYN-7). Every rule that reads a node's ports reads them from its effective schemas.

