id: SCH-5
family: GR-SCHEMA
part: I

title: Reserved config-only parameters always carry a default

normative: >-
  `dynamicParameters`, `dynamicOutputs` and `branches` are reserved config-only
  parameters, and MUST NOT be input ports: a node type that marks one
  `connectable` cannot be built (SCH-24). Where a node type opts one in by marking
  it `configurable`, it MUST enter the config schema and MUST get a
  config-defaults entry: the first of the node type's default and the schema's
  default that is an array, else an empty array. Such an entry MUST NOT be omitted
  and MUST NOT be `null`, unlike an ordinary configurable parameter, whose entry
  is omitted when it has no effective default (CFG-18).

posture: normative-target
level: core
