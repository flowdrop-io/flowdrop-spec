id: R7.c
family: GR-VAL
part: I

title: A node instance decides which of its ports are exposed

summary: >-
  One chain answers "is this port exposed?" everywhere it is asked: for edges
  and for the workflow's exposure map alike.

normative: >-
  A port's effective exposure on a node MUST be the one EXPO-2 resolves. Exposing a
  port on the instance therefore makes an edge to or from it legal that would
  otherwise be refused.

