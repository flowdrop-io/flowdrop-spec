id: R1.c
family: GR-VAL
part: I

title: A missing executor is reported once per node

normative: >-
  A node whose executor is missing MUST yield exactly one R1 error, however many ports
  the node exposes. The defect is a property of the node, not of its ports.

posture: normative-target
level: extended
