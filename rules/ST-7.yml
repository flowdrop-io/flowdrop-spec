title: The status vocabulary was closed
summary: >-
  Withdrawn with the polled status surface. See the legacy appendix.

normative: >-
  Retired with the polled status surface. Its status vocabulary was
  initialized, idle, running, completed, failed and interrupted. The vocabulary
  itself outlived the surface as the status set carried on runtime status
  broadcasts, there joined by skipped.

