server {
    listen 80;
    listen [::]:80;
    server_name _;

    # The exported site lives under `spec/` in the image, not at the document root:
    # see the Dockerfile. Next's `output: 'export'` writes `out/` with no basePath
    # directory in it, so the base path has to exist somewhere, and putting it in the
    # filesystem rather than in a rewrite keeps `try_files $uri` meaning what it says.
    # An ingress `rewrite-target` was the other option and is worse: it strips the
    # prefix before nginx sees it, which the client-side router and the extensionless
    # /spec/api/search fetch then disagree with, and both fail quietly.
    root /usr/share/nginx/html;
    index index.html;

    # llms.txt and llms-full.txt are markdown served as .txt; without this nginx
    # labels them text/plain with no charset and a browser guesses the encoding.
    charset utf-8;

    # Every page is a directory, so nginx issues a redirect for the slash-less form.
    # It must be relative: nginx sees plain HTTP on port 80 behind the ingress, so an
    # absolute Location would send a reader from https://flowdrop.io/spec/rules/x to
    # http://flowdrop.io:80/spec/rules/x/ — or worse, to the pod's own hostname.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/schema+json
        application/xml
        font/otf
        font/ttf
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Next's hashed build output. Immutable by construction.
    location /spec/_next/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/nginx-headers.conf;
        try_files $uri =404;
    }

    # Every page has a markdown twin, published at the page's own URL with `.md`
    # appended — the convention a reader (or a model) will try first. Next cannot
    # generate that path, because a dynamic route segment cannot carry an extension,
    # so the files live under /spec/llms and are served from here. The rewrite is
    # nginx's job precisely because the alternative is teaching every citation a
    # second URL.
    #
    # Served as text/plain so a browser renders it instead of downloading it.
    location ~ ^/spec/rules/(?<fam>[^/]+)/(?<rule>[^/]+)\.md$ {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/conf.d/nginx-headers.conf;
        try_files /spec/llms/$fam/$rule.md =404;
    }

    location ~ ^/spec/(?<page>conventions|glossary)\.md$ {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/conf.d/nginx-headers.conf;
        try_files /spec/llms/$page.md =404;
    }

    # The same files at their own address, for anything that found them there.
    location ~ ^/spec/llms/.+\.md$ {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/conf.d/nginx-headers.conf;
        try_files $uri =404;
    }

    # The JSON feed, the sitemap and robots.txt carry their own types from
    # mime.types; only the cache windows differ. The feed is regenerated on every
    # deploy, so an hour is as long as it should be trusted.
    location = /spec/rules.json {
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/conf.d/nginx-headers.conf;
        try_files $uri =404;
    }

    # The rule schema at the identifier it carries in its own `$id`. Typed by hand:
    # mime.types would call it application/json, which is true but says less, and
    # the whole point of serving it here is that the identifier resolves to the
    # thing it claims to be. The unversioned path is the alias for "current"; it is
    # a redirect rather than a copy so there is only ever one document.
    location = /spec/schema/1/rule.json {
        # `default_type` alone would lose to mime.types, which claims every .json.
        # An empty `types` block clears the map for this location so the fallback is
        # what actually gets sent.
        types { }
        default_type application/schema+json;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/conf.d/nginx-headers.conf;
        try_files $uri =404;
    }

    location = /spec/schema/rule.json {
        return 302 /spec/schema/1/rule.json;
    }

    # The search index is a prerendered, extensionless file that the client fetches
    # at exactly this path. It must not be redirected to /spec/api/search/ and must
    # not be served as octet-stream, which is why it is matched exactly and typed by
    # hand. Two megabytes uncompressed, a quarter of that gzipped.
    location = /spec/api/search {
        default_type application/json;
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/conf.d/nginx-headers.conf;
        try_files $uri =404;
    }

    # `location /spec/` cannot match the bare `/spec`, and nginx will not derive the
    # redirect on its own because /spec is not a directory in the filesystem sense
    # that it checks first.
    location = /spec {
        return 302 /spec/;
    }

    # One directory per page (`trailingSlash: true`). A rule that does not exist gets
    # the 404 page rather than an empty body: identifiers are cited from outside this
    # site, so a stale citation has to land somewhere that says so.
    location /spec/ {
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/conf.d/nginx-headers.conf;
        try_files $uri $uri/ $uri.html =404;
    }

    # In production the ingress only routes /spec here. Reaching the pod directly, or
    # by any other path, means the specification, so say so rather than 404.
    location / {
        return 302 /spec/;
    }

    error_page 404 /spec/404.html;
    location = /spec/404.html {
        internal;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/nginx-headers.conf;
    }
}
