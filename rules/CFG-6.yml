id: CFG-6
family: GR-CFG
part: I

title: Priority 3, the effective default, unconditionally

normative: >-
  Where neither priority 1 (CFG-4) nor priority 2 (CFG-5) applies, a parameter MUST take
  its effective default (CFG-3), where it has one. This fallback is unconditional: no
  gate flag suppresses it. A parameter with no effective default is not supplied by any
  priority, and MUST be absent from the resolved parameter set (CFG-14).

posture: normative-target
level: core
