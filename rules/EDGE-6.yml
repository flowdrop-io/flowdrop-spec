id: EDGE-6
family: GR-EDGE
part: I

title: An error edge routes a failure instead of raising it

normative: >-
  An edge whose source handle ends with `-output-error` is an error edge. When a node
  that has one fails, the failure MUST be routed rather than raised. The node's job MUST
  be recorded as failed and marked as having been routed. The node MUST yield an error
  payload that carries `message`, `code`, `node_id` and `retryable`. The run MUST
  continue along the error edge.

posture: normative-target
level: core
profiles:
  - storage-api
  - runtime

