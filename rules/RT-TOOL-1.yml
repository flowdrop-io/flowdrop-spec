id: RT-TOOL-1
family: RT-TOOL
part: II

title: A tool result carries artifacts alongside its data, never inside it

summary: >-
  A tool can return something structured (a chart, a record, a file reference)
  that the model is not meant to read as prose. It travels beside the result,
  not inside it.

normative: >-
  A tool result MUST have the shape `{success, data, error}`. A result whose call
  attached structured artifacts MUST carry an additional `artifacts` key. A result
  MUST NOT carry the `artifacts` key unless at least one artifact was attached, so
  an artifact-free result keeps the plain three-key shape unchanged. Artifacts
  MUST be attached additively. Artifacts MUST NOT be folded into `data`: the two
  are disjoint.

posture: normative-target
level: extended
profiles:
  - runtime

