id: SCH-14
family: GR-SCHEMA
part: I

title: Every executable node gets a hidden error output

normative: >-
  A reserved `error` output port MUST be injected on every node type except a
  non-executable one. The injected port MUST carry display order 120. The injected
  port MUST ship hidden.

posture: normative-target
level: core
profiles:
  - storage-api
  - editor-client

