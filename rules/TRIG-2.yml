id: TRIG-2
family: RT-TRIG
part: II

title: Jitter is rolled once and never re-rolled
summary: >-
  Spreading trigger load cannot become a way for a trigger never to fire. The
  delay is drawn on the pass that finds the trigger due and then held to, however
  many passes follow.

normative: >-
  Where a trigger's firing is spread by a random delay, a maximum of zero or
  less MUST mean the delay is off. With the delay off, the firing MUST NOT be
  held, and no state is recorded, so it is not a zero-length window. Otherwise
  the bounds are clamped before use. A negative minimum MUST become zero. A
  minimum above the maximum MUST be used as both bounds. On the first pass at
  which the trigger is due, one delay MUST be drawn uniformly at random within
  the bounds. The resulting fire time is recorded. The firing MUST be held.
  Every later pass MUST use the recorded fire time rather than drawing again
  (re-drawing on each pass would let a trigger be deferred indefinitely). The
  firing MUST be released as soon as the current time reaches that fire time,
  inclusive. On release the record MUST be discarded, so the next due firing
  draws afresh. The record MUST be scoped to a single trigger, so one trigger's
  window never holds another back.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

