id: API-2
family: GR-API
part: I

title: The turn endpoint and the launch endpoint judge inputs identically

normative: >-
  A session turn's `inputs` MUST be checked exactly as a launch's are. An undeclared
  key MUST be refused. A declared required input MUST be enforced. Values MUST be
  checked against the declared schema. Resolution into the run's initial data MUST be
  strict. The same body MUST earn the same verdict at both endpoints. A turn MUST NOT
  accept, by merging raw caller input into the run's initial data, anything the launch
  endpoint would refuse. A turn whose inputs are refused MUST be refused with 400.

posture: normative-target
level: core
profiles:
  - storage-api
  - runtime

added: "1.0"
changed: "1.0"

