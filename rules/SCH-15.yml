id: SCH-15
family: GR-SCHEMA
part: I

title: A reserved port states its exposure only when it diverges

normative: >-
  An injected reserved port MUST declare `x-exposed-by-default: false` only where that
  diverges from the default of true. Where it is exposed by default it MUST say
  nothing about exposure. A reader MUST take silence as exposed.

posture: normative-target
level: extended
profiles:
