id: SCH-29
family: GR-SCHEMA
part: I

title: Stored metadata is never authoritative at run time

normative: >-
  Before a workflow runs, every node MUST be re-enriched from its live node type. The
  workflow MUST then be normalized from the result. Metadata stored with the workflow
  MUST NOT be treated as authoritative at run time.

posture: normative-target
level: core
profiles:
  - storage-api
  - runtime

added: "1.0"
changed: "1.0"

rulings:
