id: BR-6
family: RT-BR
part: II

title: A stale source does not satisfy an edge

summary: >-
  Inside a loop, a source can be completed and branch-active and still be speaking
  for the wrong round. Two independent staleness tests sit on every edge, and a
  source gated by either does not satisfy.

normative: >-
  A source that has been superseded MUST NOT satisfy an edge: where a newer execution
  of the source node already exists, that source's branch decision MUST NOT activate a
  trigger edge, an error edge, or a data edge leaving a named port of a source that
  emitted an active-branch list; a source vouches only for its own iteration.
  Independently, a completed source from a round behind the consumer's, on a loop both
  are inside, MUST NOT satisfy a trigger, error or ordinary data edge, named port or
  not. A source that shares no loop with the consumer MUST NOT be gated on this
  ground, so no loop deadlocks. An edge whose source is gated by either test MUST be
  unsatisfied, so a consumer never runs on a mixture of rounds.

posture: normative-target
level: core
profiles:
  - runtime

