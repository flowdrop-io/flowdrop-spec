id: ORC-3
family: RT-ORC
part: II

title: An unknown strategy identifier falls back, and says so
normative: >-
  A request for a strategy identifier the implementation does not know MUST fall back to
  the default strategy. Falling back records a warning. Where no
  fallback strategy is available either, the request MUST fail rather than silently
  choosing one.

posture: normative-target
level: extended
profiles:
  - runtime

