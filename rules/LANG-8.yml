id: LANG-8
family: GR-LANG
part: I

title: A property path that cannot be read yields null
summary: >-
  Property paths trade diagnosis for calm: nothing raises, and a reader cannot tell
  a missing value from a stored one.

normative: >-
  Property-path evaluation never raises. A path that cannot be read yields null,
  which is indistinguishable from a path that reads a stored null.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"
