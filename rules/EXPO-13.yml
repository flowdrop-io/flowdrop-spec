id: EXPO-13
family: GR-EXPO
part: I

title: A node type can hide an output outright

normative: >-
  Where a node type marks an output port `exposed: false`, that output MUST be
  stripped from every instance's result unconditionally. An instance override MUST NOT
  restore it. Otherwise the output's effective exposure (EXPO-2) MUST decide.

posture: normative-target
level: core
