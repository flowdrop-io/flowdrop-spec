id: R6.b
family: GR-VAL
part: I

title: Required config keys are present

summary: >-
  The list of required keys is the one the node type's derived config schema
  publishes, not the node type's raw required flags; a parameter that can be
  fed by an edge is deliberately not required in config.

normative: >-
  Every key the node's derived config schema marks required MUST be present in the
  node's `config`. A key present with the value `null` counts as present. Each missing
  key MUST yield one `R6_CONFIG_REQUIRED` at `node.{id}.config.{key}` (where `{id}` is
  the node's id and `{key}` the missing key), and the save MUST NOT take effect. A
  parameter the node type also marks connectable is not marked required in the derived
  config schema, so its absence from `config` MUST be accepted at save even when no edge
  supplies it. That verdict MUST be decided from the node type's declared flags and
  never from the workflow's actual edges.

posture: normative-target
level: core
profiles:
  - storage-api

