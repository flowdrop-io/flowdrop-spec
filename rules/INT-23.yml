id: INT-23
family: RT-INT
part: II

title: No expiry is a sentinel, and the two expiry paths differ on purpose

summary: >-
  An interrupt with no expiry waits indefinitely, and survives every sweep.
  When one does expire, whether that ends the run depends on which path expired it,
  and that asymmetry is the rule, not an oversight.

normative: >-
  An interrupt MUST wait indefinitely unless it carries a positive expiry. An absent
  or zero expiry is the no-expiry sentinel: it MUST NOT be treated as overdue, and any
  sweep MUST exclude it, so an open-ended question to a human is never reaped. An
  overdue interrupt is expired by two paths that differ only in whether the expiry is
  announced. A sweep MUST expire the interrupt, record it, and announce the expiry,
  which is what ends the run holding it open (INT-18). Answering an already-overdue
  interrupt MUST expire and record it as a side effect of refusing the answer. That
  path MUST NOT announce anything: it is one caller answering one question, and
  announcing there would let a late click end the whole run.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

