id: CFG-9
family: GR-CFG
part: I

title: A required parameter that nothing supplies fails the node

normative: >-
  A parameter is missing where it is required and no priority supplied it (CFG-4
  to CFG-6), so that it is absent from the resolved parameter set (CFG-14). Where
  any parameter is missing, the node execution MUST fail with a missing-parameter
  error naming every missing parameter, in no defined order, unless CFG-21 skips
  the node. A `null` supplied at any priority is present, and MUST satisfy the
  requirement, as `required` is satisfied in JSON Schema; whether that `null` is
  acceptable is decided by the parameter's schema (CFG-10). The check MUST run
  after the whole chain has been walked for every parameter, and before any
  resolved value is validated.

posture: normative-target
level: core
profiles:
