id: EXPO-15
family: GR-EXPO
part: I

title: A model can fill only visible, unwired parameters

normative: >-
  Where a node is offered to an agent node as a callable tool, a parameter MUST be
  fillable by the model when it is connectable and exposed and no data edge already
  feeds that port. A hidden parameter, a non-connectable one, and one a wire
  already supplies MUST NOT be fillable by the model.

posture: normative-target
level: extended
profiles:
  - storage-api
  - runtime

