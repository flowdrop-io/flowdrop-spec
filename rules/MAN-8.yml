id: MAN-8
family: GR-MAN
part: I

title: An entry that cannot be built is skipped, not fatal
summary: >-
  One broken entry does not cost the workflow its whole contract, so the build
  drops it and carries on.

normative: >-
  An entry that cannot be resolved (the node it names is missing, the node declares no
  such port) MUST be skipped, and the remaining entries MUST still be built. A warning
  is logged for it. An entry that is structurally malformed, missing or empty in
  `name`, `node_id` or `port`, MUST likewise be skipped and MUST NOT contribute to the
  contract.

posture: normative-target
level: extended
profiles:
  - storage-api

added: "1.0"
changed: "1.0"

rulings:
