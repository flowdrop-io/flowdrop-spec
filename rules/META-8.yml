id: META-8
family: RT-META
part: II

title: The two schema variants are cached on deliberately different terms
summary: >-
  The annotated document carries text translated into the reader's interface language, so a
  shared copy would serve one interface language's annotations to a reader in
  another.

normative: >-
  The plain workflow schema document MUST be publicly cacheable for at most 60
  seconds. The annotated document MUST be served `no-cache`. A schema response
  MUST vary by the argument selecting the variant on every path, including the one
  that adds nothing else. A schema response MUST vary by interface language when
  annotated, and MUST NOT vary by it otherwise. A response MUST be invalidated
  when the workflow it describes changes, and MUST NOT be invalidated by anything
  broader.

posture: normative-target
level: extended
profiles:
  - runtime
  - editor-client

added: "1.0"
changed: "1.0"

rulings:
