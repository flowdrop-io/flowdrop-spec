id: SCH-2
family: GR-SCHEMA
part: I

title: Gate flags come from the node type, and default off
summary: >-
  Whether a parameter is connectable, configurable or required is the node type's
  answer, not the declared schema's. A parameter the node type never mentions
  reaches neither derived schema.

normative: >-
  The `connectable`, `configurable` and `required` gate flags for a parameter MUST be
  read from the node type's own parameter configuration only, each defaulting to false
  where the node type declares no entry for that parameter. A parameter the node type
  does not declare therefore MUST appear in neither derived schema and in neither
  `required` array. Same-named keys written in the declared schema MUST NOT be read by
  the gate. They MUST NOT be stripped either: they survive verbatim into the served
  schemas. A property-level `required: true` MUST be read on exactly one path: where a
  node is exposed as a model-facing tool, it MUST be lifted into the enclosing
  object's `required` array before the schema is handed to the model.

posture: normative-target
level: extended
profiles:
  - storage-api
  - editor-client

