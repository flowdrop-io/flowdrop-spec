id: MEM-10
family: GR-MEM
part: I

title: A real tool result replaces the placeholder that stood in for it
summary: >-
  A healed message says a call was interrupted. If the result later arrives, the
  buffer shows the answer, not the guess.

normative: >-
  When a tool result arrives for an id whose buffer entry is a synthetic healed
  placeholder, the real result MUST replace the placeholder in place (at the same
  position, so its adjacency to the declaring turn is preserved). The healed
  marking MUST be removed with the placeholder. An entry that is not a synthetic
  healed placeholder MUST NOT be overwritten. After the replacement the entry is
  an ordinary answered result, so a second real result for the same id MUST be
  deduplicated as usual. An incoming message that is itself marked healed MUST NOT
  replace anything.

posture: normative-target
level: extended
profiles:
