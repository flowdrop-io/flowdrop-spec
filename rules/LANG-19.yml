id: LANG-19
family: GR-LANG
part: I

title: Extracting all matches for a property path always yields a list

normative: >-
  Extracting all matches for a property path MUST yield a list. A single match MUST be
  wrapped in a one-element list. A path that reads a stored `null` matches it, and MUST
  yield a one-element list holding `null`. A path that matches nothing MUST yield the
  empty list.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

rulings:
  - OPEN-25
  - OPEN-26
