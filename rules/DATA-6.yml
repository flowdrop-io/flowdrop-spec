id: DATA-6
family: RT-DATA
part: II

title: Initial data fills a node's ports only where no edge did

normative: >-
  Initial data supplied with a run, keyed by node identifier, fills that node's
  input ports underneath anything an edge delivered: an edge-delivered value wins,
  including an edge-delivered `null`. An entry keyed for another node, or one that
  is not a map of port names to values, is ignored.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

