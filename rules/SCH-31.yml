id: SCH-31
family: GR-SCHEMA
part: I

title: Config field order applies inside a ui schema only

normative: >-
  `x-config-order` orders config fields ascending; a property whose value is absent
  or not numeric counts as 0, and ties keep declaration order. It takes effect
  inside a generated ui schema only: where no property carries a registered group
  there is no ui schema, no layout, and `x-config-order` has no effect on the flat
  form. The earlier spelling `x-display-order` carries no meaning; a schema that
  still writes only it orders at 0, like any untagged property.

posture: normative-target
level: extended
profiles:
