id: OCX-6
family: RT-OCX
part: II

title: The connector validates nothing it publishes
summary: >-
  The published payload schema is metadata for the calling platform to render and
  enforce. Enforcement belongs to that platform and to the workflow, not to the
  adapter in between.

normative: >-
  The declared payload schema and required fields an externally invoked trigger
  publishes are declarative metadata for the calling platform. A payload that
  violates them MUST be passed through unmodified. Each top-level schema
  property MUST become a typed field in the published service description, and a
  nested property MUST NOT. Nested structure MUST ride inside the payload as an
  object. Recursive translation of a schema into fields is deliberately not
  attempted.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

