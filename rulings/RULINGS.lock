# Every ruling identifier ever issued, one per line. Append-only. Identifiers are
# never renumbered and never reused. A ruling is history: where one turns out to be
# wrong a later ruling supersedes it and says so, and the superseded ruling stays
# exactly as it was written.
#
# CI fails if an identifier here has no ruling file, if a ruling file carries an
# identifier that is not here, or if a rule cites a ruling that does not exist.
