id: INT-5
family: RT-INT
part: II

title: Cancel and pause signals are observed between job iterations

summary: >-
  A signal never interrupts a job mid-flight. It is observed at the boundary
  between iterations, which is why a cancelled run has no half-executed node.

normative: >-
  An engine MUST poll for a pending signal between job iterations. The in-flight job
  MUST always finish first, and the absence of a signal MUST continue the loop. A
  cancel signal MUST mark the run cancelled and MUST stamp its execution time. The
  engine MUST then announce the outcome twice: a cancellation event and a
  run-completed announcement carrying the cancelled status, so that cancellation is
  announced like any other terminal outcome (ORC-15). It MUST then answer with status
  `cancelled` and metadata naming the engine, the signal and the reason. A pause
  signal MUST pause the run and MUST announce only the pause, with no completion
  announcement. The engine MUST then answer with status `paused` and the same metadata
  keys. It MUST leave the signal record pending, because that record is the run's
  resume key.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

