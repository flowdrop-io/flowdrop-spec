id: R8.b
family: GR-VAL
part: I

title: An edge's target node exists

normative: >-
  An edge whose `target` does not name a node in the workflow MUST be refused with
  `R8_EDGE_TARGET_MISSING` at `edge.{index}`, where `{index}` is the edge's position in
  the workflow's edge list. An absent `target` names no node, and neither does an empty
  one.

posture: normative-target
level: core
profiles:
  - storage-api

