id: OCX-5
family: RT-OCX
part: II

title: A trigger's condition set is a closed vocabulary

summary: >-
  A connector with its own data to carry has one place to put it, so a reader can
  tell a declared condition from a connector's private key.

normative: >-
  A trigger's conditions are a closed vocabulary, so that a connector with its
  own data to carry has one place to put it and a reader can tell a declared
  condition from a connector's private key. A trigger's conditions MUST carry
  only the condition keys this specification declares. Event-type-specific data
  a connector needs to carry MUST be written under the designated extension key,
  whose contents this specification does not constrain. A connector writing its
  own keys beside the declared ones is writing an invalid condition set.

posture: normative-target
level: extended
profiles:
