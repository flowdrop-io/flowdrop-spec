id: CFG-2
family: GR-CFG
part: I

title: A node type states every port's default exposure

summary: >-
  Whether a port is exposed decides what can be wired to it, so the value is always
  stated. The specification does not fill one in.

normative: >-
  Node type metadata MUST state `exposedByDefault`, a boolean, for every port the node
  type has. Metadata that omits it for a port does not conform, and a reader MUST NOT
  assume a value in its place.

posture: normative-target
level: core
profiles:
