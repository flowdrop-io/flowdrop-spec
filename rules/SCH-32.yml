id: SCH-32
family: GR-SCHEMA
part: I

title: Every re-enterable node gets a hidden loop-back input
summary: >-
  Re-entry is a property of the graph, not of a handful of node types. Every node
  that can be re-entered declares the port; it just ships hidden, so no canvas
  gains a re-entry handle until an author asks for one.

normative: >-
  A reserved `loop_back` input MUST be injected on every re-enterable node type (every
  node type that is not a start, terminal or non-executable one) with display order 95
  and the `trigger` lane. The injected port MUST ship hidden, so no canvas gains a
  re-entry handle until an author exposes the port on that instance. A node type that
  declares its own `loop_back` MUST keep it and the injection MUST be skipped, because
  such a declaration carries semantics the injection does not. Because the port is
  declared rather than absent, an edge drawn into an unexposed `loop_back` MUST be
  refused as an edge into an unexposed port.

posture: normative-target
level: extended
profiles:
