id: INT-18
family: RT-INT
part: II

title: An expired outward interrupt ends the run it was holding open

summary: >-
  An outward interrupt is the only thing that can resume the run that raised it.
  Once it expires the resume key is gone, and without this rule the run would sit
  paused forever: never terminal, never announced, invisible to everything that
  reports on finished runs.

normative: >-
  When an outward interrupt expires, the run that raised it MUST be ended: its
  still-active jobs MUST be cancelled, the run MUST be marked cancelled, and the
  outcome MUST be announced like any other terminal outcome (ORC-15). Two exclusions
  bind. The expiry of an inward signal MUST NOT end a run: it acts on a run it does
  not own, and a lapsed cancel or pause request is a request that went unanswered, not
  a run that ended. A run that has already recorded an outcome MUST keep it. A late
  expiry MUST NOT overwrite that outcome and MUST NOT announce a second time. A
  failure while ending one run is recorded and never raised, so a sweep is not aborted
  mid-backlog. An interrupt with no expiry (INT-23) is never swept and never reaches
  this path, so an open-ended question to a human waits indefinitely. A confirmation
  gate interrupt is the deliberate exception, always carrying an expiry (RT-GATE-1),
  so an abandoned gated run ends here instead of holding an inbox entry forever.

posture: normative-target
level: core
profiles:
  - runtime

