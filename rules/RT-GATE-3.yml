id: RT-GATE-3
family: RT-GATE
part: II

title: Consent binds to the node and its exact resolved arguments

summary: >-
  The operator approved one call, not "this node from now on". If the arguments
  drift, the approval no longer describes what would happen.

normative: >-
  A consent MUST bind to a hash over the node identifier and its canonicalized
  resolved arguments. The canonicalization MUST sort keys, encode scalars stably, and
  exclude internal parameters (those whose names carry the reserved `__` prefix). Any
  mismatch between the hash a consent carries and the hash of the call at hand MUST be
  treated as no consent. The gate MUST ask again. It MUST NOT reuse the earlier
  consent. Where a question is still pending for arguments that have since drifted, it
  MUST be withdrawn before the new one is asked. Where a question is still pending for
  the same call, that question MUST be re-raised rather than duplicated.

posture: normative-target
level: core
profiles:
  - runtime

