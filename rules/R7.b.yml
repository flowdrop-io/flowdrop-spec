id: R7.b
family: GR-VAL
part: I

title: No edge leaves a hidden output port

normative: >-
  An edge whose source port is a port of the source node (DYN-8) but is not exposed
  on that node MUST be refused with `R7_EDGE_SOURCE_NOT_EXPOSED` at
  `edge.{index}`.

