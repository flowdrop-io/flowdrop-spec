id: SNAP-2
family: RT-SNAP
part: II

title: Snapshot access is decided on the snapshot, and absence answered first

normative: >-
  Reading or deleting a snapshot loads it by execution id and asks it for view or
  delete authority. A snapshot that does not exist MUST be answered `404`. A
  snapshot the caller may not reach MUST be answered `403`. Absence MUST be
  answered before denial. A read that finds the record but no readable payload
  MUST answer `404`. A read MUST NOT answer a partial document. The list endpoint
  does not ask per record: it narrows the query by ownership. A snapshot belonging
  to another principal MUST be absent from the list. The list MUST NOT carry a
  denial on such a snapshot.

posture: normative-target
level: core
profiles:
