id: R4.a
family: GR-VAL
part: I

title: An exposed workflow port is named in the permitted alphabet

summary: >-
  An exposure name is a caller-facing parameter name. Restricting it to a small
  alphabet keeps it usable as a key in every context a caller passes it
  through.

normative: >-
  A workflow exposure entry's `name` MUST match `^[a-z0-9_-]+$`. A name that is absent,
  empty or outside that alphabet MUST be refused with `R4_NAME_FORMAT` at
  `schema.{side}.{index}`, where `{side}` is `input` or `output` and `{index}` the
  entry's position in that side's list. Unlike R4.c, this failure MUST NOT skip the
  entry's remaining checks: uniqueness, and the node and port checks of a bound entry,
  MUST still be evaluated. Two entries whose names are both the empty string therefore
  yield two `R4_NAME_FORMAT` errors and one `R4_NAME_DUPLICATE`. An absent name takes
  part in no uniqueness comparison.

posture: normative-target
level: core
profiles:
  - storage-api

added: "1.0"
changed: "1.0"

