id: OCX-8
family: RT-OCX
part: II

title: A poll reports every terminal run, cancellation included

normative: >-
  A poll MUST report runs in any terminal status, not only successful and failed
  ones. A cancelled run is terminal and MUST be reported, so a polling caller
  always reaches an end state. A run that is genuinely paused MUST NOT appear in
  any poll until it resumes or reaches a terminal status. A backlog can need
  more than one poll to drain. A poll MUST NOT drop a run on the way.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

rulings:
