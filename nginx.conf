server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # llms.txt and llms-full.txt are markdown served as .txt; without this nginx
    # labels them text/plain with no charset and a browser guesses the encoding.
    charset utf-8;

    # Every page is a directory, so nginx issues a redirect for the slash-less form.
    # It must be relative: nginx sees plain HTTP on port 80 behind the ingress, so an
    # absolute Location would send a reader from https://spec.flowdrop.io/rules/x to
    # http://spec.flowdrop.io:80/rules/x/ — or worse, to the pod's own hostname.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        font/otf
        font/ttf
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Next's hashed build output. Immutable by construction.
    location /_next/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/nginx-headers.conf;
        try_files $uri =404;
    }

    # Every page has a markdown twin, published at the page's own URL with `.md`
    # appended — the convention a reader (or a model) will try first. Next cannot
    # generate that path, because a dynamic route segment cannot carry an extension,
    # so the files live under /llms and are served from here. The rewrite is nginx's
    # job precisely because the alternative is teaching every citation a second URL.
    #
    # Served as text/plain so a browser renders it instead of downloading it.
    location ~ ^/rules/(?<fam>[^/]+)/(?<rule>[^/]+)\.md$ {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/conf.d/nginx-headers.conf;
        try_files /llms/$fam/$rule.md =404;
    }

    location ~ ^/(?<page>conventions|glossary)\.md$ {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/conf.d/nginx-headers.conf;
        try_files /llms/$page.md =404;
    }

    # The same files at their own address, for anything that found them there.
    location ~ ^/llms/.+\.md$ {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/conf.d/nginx-headers.conf;
        try_files $uri =404;
    }

    # The search index is a prerendered, extensionless file that the client fetches
    # at exactly this path. It must not be redirected to /api/search/ and must not be
    # served as octet-stream, which is why it is matched exactly and typed by hand.
    # Two megabytes uncompressed, a quarter of that gzipped.
    location = /api/search {
        default_type application/json;
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/conf.d/nginx-headers.conf;
        try_files $uri =404;
    }

    # One directory per page (`trailingSlash: true`). A rule that does not exist gets
    # the 404 page rather than an empty body: identifiers are cited from outside this
    # site, so a stale citation has to land somewhere that says so.
    location / {
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/conf.d/nginx-headers.conf;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/nginx-headers.conf;
    }
}
