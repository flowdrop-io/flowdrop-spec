id: RT-GATE-13
family: RT-GATE
part: II

title: A gate question belongs to the initiator, and an ownerless one is findable

summary: >-
  A question assigned to whoever happened to persist it (a background worker with
  no identity) matches nobody's inbox and is never answered. A run with no
  initiator at all needs somewhere for its question to land.

normative: >-
  A gate interrupt MUST be assigned to the run's initiator (the owner of the job, as
  stamped when the run was launched). It MUST NOT be assigned to whichever identity
  happens to persist it. A run with no initiator, such as one launched by a schedule,
  a webhook or an anonymous trigger, MUST raise its question unassigned. Unassigned
  gate questions MUST be visible to holders of the authority to resolve any interrupt.
  The inbox's scoping to the owning identity MUST NOT be relaxed in any other way, and
  this relaxation covers unassigned gate questions only. An assigned question MUST
  stay scoped to its owner whatever authority the viewer holds (being able to resolve
  any interrupt grants resolution, not a merged inbox). An unassigned question that is
  not a gate question MUST stay invisible. Where nobody attends an unassigned gate
  question it MUST expire and the run MUST be cancelled (RT-GATE-1, INT-18): fail
  closed, never silently approved.

posture: normative-target
level: extended
profiles:
  - runtime

