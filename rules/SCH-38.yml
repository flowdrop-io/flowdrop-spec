id: SCH-38
family: GR-SCHEMA
part: I

title: A loop-back input is the control sink and declares `trigger`
summary: >-
  A loop-back input carries no value. It is the control sink every other lane can
  reach, and `trigger` is the lane that plays that part.

normative: >-
  A `loop_back` input MUST declare the `trigger` lane. The rules that make the sink
  reachable from every other lane MUST target `trigger`. A data output can therefore
  be drawn into an ordinary trigger input; the runtime MUST discard the value rather
  than deliver it. Compatibility is an authoring affordance only: no server path
  validates a connection against port lanes.

posture: normative-target
