id: DYN-5
family: GR-DYN
part: I

title: A declared parameter wins a name collision with a dynamic port

normative: >-
  Where a dynamic port's name is also the name of a parameter the node's processor
  declares, the declared parameter wins and the dynamic port is ignored. An author
  cannot shadow a declared parameter by adding a dynamic port of the same name.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"
