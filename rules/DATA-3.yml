id: DATA-3
family: RT-DATA
part: II

title: A trigger edge carries no data

normative: >-
  A trigger edge conveys only that its source completed. It MUST NOT deliver a
  value, and it MUST NOT fill any input port on its target.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

