id: INT-15
family: RT-INT
part: II

title: An engine that cannot use a snapshot refuses it, never restarts

summary: >-
  Silently discarding a snapshot and starting over looks like resilience and is the
  opposite: it re-runs every side effect the snapshot recorded as already done.

normative: >-
  An engine that cannot consume a snapshot it has been given MUST refuse, naming the
  snapshot. It MUST NOT silently discard the snapshot and start the run from the
  beginning. An engine with no snapshot-seeding mechanism therefore MUST refuse any
  snapshot attached to a run, before any run or job exists. A run with no snapshot
  attached MUST remain a plain fresh start.

posture: normative-target
level: core
profiles:
  - runtime

