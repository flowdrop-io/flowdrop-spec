id: STORE-14
family: GR-STORE
part: I

title: Every surface that returns a workflow returns one object

summary: >-
  List, create, read and update all publish the same workflow object. A client learns
  one shape, not four.

normative: >-
  Every surface that returns a workflow MUST carry the keys `id`, `name`, `description`,
  `nodes`, `edges`, `metadata`, `created`, `changed` and `uid`. `nodes` MUST be enriched
  with each node's node-type metadata. `metadata` MUST be the value as published on read.
  These keys MUST be spelled in lower case, `created`, `changed` and `uid` included.
  `interface` MUST be present when the workflow declares at least one input or output
  port. `interface` MUST be absent when the workflow declares none, never emitted as an
  empty object or an empty array. A workflow MUST have the same values for these keys on
  every surface that returns it, including any surface that embeds a workflow outside the
  API.

posture: normative-target
level: core
profiles:
