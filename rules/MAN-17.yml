id: MAN-17
family: GR-MAN
part: I

title: Declared outputs are collected by the same mapping, in reverse
summary: >-
  The output side of the manifest, with one distinction that matters: a node that
  produced null produced something, and is not the same as a node that produced
  nothing.

normative: >-
  Each declared output name MUST resolve to the result the bound node produced on the
  bound port. Presence MUST be decided by whether the key exists. A null value counts
  as produced, and MUST be returned. An output whose node produced nothing at all MUST
  be dropped from the result, and a warning is logged. A malformed output entry MUST
  be skipped.

posture: normative-target
level: extended
profiles:
  - storage-api

added: "1.0"
changed: "1.0"

