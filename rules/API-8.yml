id: API-8
family: GR-API
part: I

title: Every refusal carries a stable machine-readable code

summary: >-
  A client has to be able to tell one refusal from another without reading English.
  Codes are the contract; the message is for a person.

normative: >-
  Every refusal an API endpoint emits MUST carry a stable, machine-readable
  `error_code` alongside the human-readable `error` string. Message text is never
  contract: a client MUST NOT classify a refusal by matching its message, and an
  implementation MUST NOT treat wording as load-bearing. A code MUST have one published
  definition that a client and a test can both name by it. Once published, a code's
  meaning MUST NOT change. A published code MUST NOT be reused.

posture: normative-target
level: core
profiles:
  - storage-api

