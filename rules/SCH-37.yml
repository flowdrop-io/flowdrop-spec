id: SCH-37
family: GR-SCHEMA
part: I

title: A control port declares its lane, never a schema type

normative: >-
  `trigger`, `tool` and `loop_back` carry no value, so no JSON Schema type describes
  them. A control port MUST declare `x-data-type` and no `type`. A reserved-port
  injection MUST assign the lane by the port's role rather than deriving it. Control
  lanes remain full members of the lane vocabulary; what is forbidden is spelling one
  in `type`. A lane that carries no value MUST NOT be offered as a dynamic port type
  and MUST NOT be on the list of lanes an author can pick.

posture: normative-target
level: core
profiles:
