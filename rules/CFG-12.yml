id: CFG-12
family: GR-CFG
part: I

title: An unrecognised format passes rather than fails

normative: >-
  An implementation MUST enforce a `format` it recognises: a value that does not match
  it MUST fail validation (CFG-10). A `format` name the implementation does not
  recognise MUST pass, so a schema written against a richer vocabulary never blocks a
  node from running.

posture: normative-target
level: extended
profiles:
  - storage-api

added: "1.0"
changed: "1.0"

