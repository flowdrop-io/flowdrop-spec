id: BR-1
family: RT-BR
part: II

title: An edge is gated only when the source actually made a branch decision

summary: >-
  Gateways decide which paths stay alive, but most edges in a workflow are not
  branch edges at all. This rule says exactly when a branch decision is allowed to
  stop an edge, so that everything else keeps flowing.

normative: >-
  An edge MUST be subject to branch gating only when all three of these hold: it leaves
  a named source port, the source's output carries an active-branch member, and that
  port is a branch port rather than a value port (BR-2). Where they hold, the edge MUST
  be followed if and only if the port's name appears in the active-branch list, both
  sides compared after trimming surrounding whitespace and lower-casing. An empty list
  names no branch, so no branch edge leaving that source is followed. In every other
  case the edge MUST be followed.

posture: normative-target
level: core
