id: SCH-22
family: GR-SCHEMA
part: I

title: A config-edit descriptor appears only where one is provided

normative: >-
  A node's metadata MUST carry a `configEdit` descriptor only where its node type
  provides one. Where the node type provides none, the metadata MUST carry no
  `configEdit` key.

posture: normative-target
level: optional
profiles:
  - storage-api
  - editor-client

added: "1.0"
changed: "1.0"

rulings:
