id: ERR-7
family: RT-ERR
part: II

title: An error edge replaces the node's output with an error envelope
summary: >-
  The envelope is the whole contract between a failing node and its handler: a handler
  can be written against it without knowing which node type failed.

normative: >-
  Where a node produces an error output and has at least one error edge, its unit of
  work MUST be recorded as failed. That unit of work MUST also be marked as
  error-routed. The node's outputs MUST be replaced by `{"error": {"message", "code",
  "node_id", "retryable"}}`. The run MUST continue. The envelope MUST carry an
  additional `details` key when the failure supplied structured detail, and MUST NOT
  carry it otherwise.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
