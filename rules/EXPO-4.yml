id: EXPO-4
family: GR-EXPO
part: I

title: A node nobody has touched stores no overrides

normative: >-
  An authoring surface MUST NOT record a `ports` map for a node instance on which
  no port has been shown or hidden. Every port of a node with no `ports` map
  resolves to its default exposure (EXPO-2), and adding a port to the node type
  later changes that node's canvas without the node being re-saved.

posture: normative-target
level: core
profiles:
