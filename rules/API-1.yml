id: API-1
family: GR-API
part: I

title: Every JSON endpoint applies the same body gate, and reports its refusals

summary: >-
  A caller does not have to learn which endpoint bounds its input. Every endpoint that
  takes a JSON body applies the same limits and gives the same answer when they are
  exceeded.

normative: >-
  Every endpoint that accepts a JSON request body MUST apply the same body gate: the
  same size, depth and top-level shape limits, refused the same way. A refusal from
  that gate MUST reach the caller as a 400. An implementation MUST NOT report it as a
  server error. Where a body is optional, its absence MUST be mapped to an empty object
  ahead of the gate. Everything else MUST go through the gate. Optional never means
  unvalidated.

posture: normative-target
level: core
