id: ORC-7
family: RT-ORC
part: II

title: Direct synchronous execution refuses a workflow that loops
summary: >-
  The engine walks the compiled order once and never re-enters a node, so it cannot
  iterate a loop. It refuses the workflow rather than running the body once and
  reporting success.

normative: >-
  Direct synchronous execution MUST walk the compiled execution order once, top to bottom,
  and MUST NOT re-enter a node. It carries results in memory. After compiling and before
  any node executes, it MUST check the compiled graph for loopback edges. Where any is
  present it MUST refuse the run with a distinguishable refusal that names the offending
  edges and nodes and points at the strategies that do iterate. In that case it MUST
  execute no node.

posture: normative-target
level: core
profiles:
