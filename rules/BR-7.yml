id: BR-7
family: RT-BR
part: II

title: A node whose triggers are all unsatisfied is skipped, not executed

summary: >-
  This is the line the whole branching design rests on: an untaken branch does not
  merely fail to fire, it terminates cleanly, visibly, and without failing the run.

normative: >-
  A node with at least one incoming trigger edge and no satisfied trigger MUST be
  skipped. It MUST NOT be executed. The skip MUST be announced with the
  machine-readable reason `branch_not_active`, on the node-level skip event, on the
  real-time status update, and on the run's snapshot. The node's identifier MUST
  appear among the run's skipped nodes in the response metadata. It MUST be counted
  there. A node with no incoming trigger edge MUST NOT be skipped for want of a
  satisfied trigger; when it runs is decided by DATA-4. At the end of a run, every node still unexecuted MUST be collected as skipped
  the same way, whether or not it had already been promoted to ready.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

rulings:
