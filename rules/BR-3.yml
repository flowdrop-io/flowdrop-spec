id: BR-3
family: RT-BR
part: II

title: An active-branch list is a list of names, trimmed and lower-cased

normative: >-
  A source's active-branch list is a list of strings. A bare string is one branch
  name taken verbatim and is never split on commas or any other separator. Entries
  that are not strings are dropped. Surviving entries are trimmed of surrounding
  whitespace and lower-cased, which is the form BR-1 compares a port name against.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

related:
  - BR-1
