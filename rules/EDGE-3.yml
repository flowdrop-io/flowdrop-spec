id: EDGE-3
family: GR-EDGE
part: I

title: A trigger edge is one whose target port is the trigger port

normative: >-
  An edge MUST be a trigger edge when, and only when, its target handle ends with
  `-input-trigger`. An edge MUST NOT be treated as a trigger edge on any other ground.

posture: normative-target
level: core
profiles:
