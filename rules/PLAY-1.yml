id: PLAY-1
family: RT-PLAY
part: II

title: Playground sessions and messages are addressed and published by UUID

normative: >-
  Every playground route parameter naming a session or a message MUST be a UUID.
  Every `id` published (a session row's, a message row's, and a message row's
  `sessionId`) MUST be that UUID. It MUST NOT be an internal record identifier. The
  session list's `ids` filter is the single exception: it MUST take a
  comma-separated list of internal identifiers, and it MUST drop values that are not
  positive integers. It is a narrowing of what the caller can already see, not a
  client-facing identifier. So that one endpoint accepts internal identifiers
  inbound and answers UUIDs outbound, deliberately.

posture: normative-target
level: core
profiles:
  - runtime
  - editor-client

added: "1.0"
changed: "1.0"

