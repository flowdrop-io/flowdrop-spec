id: PIPE-8
family: RT-PIPE
part: II

title: Published execution context is filtered, not forwarded
summary: >-
  Whatever an engine parks on a run would otherwise become public the moment it
  is written, and after one release it cannot be withdrawn without breaking
  consumers.

normative: >-
  The `execution_data.context` a run publishes MUST be a filtered projection of
  the execution context, not the stored context forwarded verbatim. The filter is a
  single point through which everything published passes. Engine-internal analysis
  artefacts (a graph-analysis snapshot such as a loop membership map is the case in
  point) MUST be removed whole rather than by selected sub-keys, so their internal
  shape is not published and can change without notice.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

rulings:
  - OPEN-25
