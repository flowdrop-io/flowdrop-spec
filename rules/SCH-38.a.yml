id: SCH-38.a
family: GR-SCHEMA
part: I

title: A retired lane keeps one release of served-but-disabled compatibility
summary: >-
  Withdrawn (OPEN-34): how an implementation retires a lane it once shipped is its own release practice.

normative: >-
  A retired lane was kept served but disabled for a major release after nothing
  shipped it. The specification no longer describes retiring a lane: that is an
  implementation's release practice (OPEN-34).

