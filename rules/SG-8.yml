id: SG-8
family: RT-SG
part: II

title: A node executed more than once keys its results by occurrence

normative: >-
  A node's first execution in a run MUST be reported under its bare node
  identifier. Each later execution MUST be reported under `{nodeId}:{n}`, where
  `n` is that node's zero-based count of prior executions in the run. The
  payload of a stop raised by the node MUST use the same key. Partial results
  reported for an interrupted run MUST use an equivalent scheme. Each completed
  execution MUST be stamped with a higher execution order than the one before
  it. A port fed by several sources MUST resolve to the newest execution of a
  source node: inside a loop, the current round's.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

