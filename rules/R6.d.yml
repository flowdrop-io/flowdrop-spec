id: R6.d
family: GR-VAL
part: I

title: A config value matches its declared type

summary: >-
  R6.d through R6.h are one check with several arms. They share a code and a
  locator and stop at the first violation, so a reader of the result sees at
  most one error per config key.

normative: >-
  A config value whose type does not match the `type` its schema declares MUST be
  refused with `R6_CONFIG_INVALID` at `node.{id}.config.{key}`, where `{id}` is the
  node's id and `{key}` the config key. A schema that declares no `type` imposes no type
  constraint, and the value MUST NOT be refused for its type, as in JSON Schema. A
  `type` that names no JSON Schema type makes the schema invalid; that is the node
  type's failure (SCH-24), and R6.j applies. R6.d to R6.h MUST all
  raise this same code at this same locator. They MUST be evaluated in one fixed order
  (type, then `enum`, then `minimum`, `maximum`, `minLength`, `maxLength`, `pattern`),
  stopping at the first violation, so one config key never yields more than one error.
  Stopping early decides which error is reported, never whether the value is refused.
  The arms are distinguished by the error's message, not by its code.

posture: normative-target
level: core
profiles:
