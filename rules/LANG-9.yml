id: LANG-9
family: GR-LANG
part: I

title: A JSONPath miss falls back to the default; an error never does

normative: >-
  JSONPath evaluation MUST distinguish a miss from an error. A query that runs
  cleanly and matches nothing is a miss: it yields the default the caller
  supplied, `null` where none was supplied, and the evaluation MUST report that
  nothing matched. A query that cannot be compiled or cannot be run is an error:
  it MUST be reported as one, and MUST NOT yield the default (LANG-22, LANG-29). A
  query that matches a `null` MUST yield `null` and report a match, never the
  default.

posture: normative-target
level: core
profiles:
  - runtime

