id: DATA-1
family: RT-DATA
part: II

title: An edge delivers one named output port to one named input port

normative: >-
  An edge MUST deliver a value from a named output port on its source node to a
  named input port on its target node. Both port names MUST be taken from the edge's
  handles. An edge with a handle that names no port MUST deliver nothing, and MUST
  NOT warn or fail the run. Delivery MUST be decided by the presence of the port's
  key in the source node's output, not by the value being non-null. A source that
  emits an explicit `null` MUST deliver `null`, and that delivered `null` MUST
  outrank the target's configuration and its schema default. A source that omits the
  key MUST deliver nothing at all, and the target port MUST fall through to its
  configuration and then to its schema default.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
