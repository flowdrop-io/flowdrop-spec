id: NET-1
family: RT-NET
part: II

title: An outbound URL is checked before the request, and the check is pinned to it
summary: >-
  Validating a name and then dialling the name is not a check: a hostile resolver
  answers publicly for the check and privately for the request.

normative: >-
  Before a node makes a request to a URL derived from workflow input, the URL MUST
  be validated. Validation MUST allow only the `http` and `https` schemes.
  Validation MUST resolve the host, over both IPv4 and IPv6. Validation MUST
  refuse the URL if any resolved address is in a private or reserved range. A
  refusal MUST be a node configuration error, which fails the node like any other
  node failure: it is routed along the node's error edge where it has one
  (EDGE-6), and otherwise fails the run (ERR-8). The request MUST be made to the
  validated address, so the connection is pinned to the address that was checked.
  The connection MUST honour an explicit port in the URL. Every node that dials a
  caller-supplied URL MUST perform this check; a second implementation of it is a
  second thing to forget to fix.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

