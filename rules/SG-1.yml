id: SG-1
family: RT-SG
part: II

title: State merges field by field, and a state value is never mutated

normative: >-
  A state update MUST be merged into the current state field by field:
  `messages` appends, `data` and `metadata` merge key by key, and every other
  field is replaced. A field the update omits MUST keep its current value. The
  merge MUST yield a new state. The merge MUST NOT modify the state it was
  applied to.

posture: normative-target
level: core
profiles:
  - runtime

