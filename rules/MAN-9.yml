id: MAN-9
family: GR-MAN
part: I

title: A workflow used as a node cannot build its own contract forever
summary: >-
  Workflows compose, so a contract build can walk into itself. The guard is per
  path, not per build, so an honest diamond still resolves.

normative: >-
  When a workflow is used as a node inside another workflow, the contract build MUST
  descend into it. Re-entering a workflow already on the current path MUST be refused:
  the entry MUST resolve to an empty object schema, rather than recursing, and a
  warning is logged. Encountering the same workflow again as a sibling, not an
  ancestor, MUST build normally.

posture: normative-target
level: extended
profiles:
  - storage-api

added: "1.0"
changed: "1.0"

rulings:
