id: CFG-5
family: GR-CFG
part: I

title: Priority 2, the author's saved config

normative: >-
  Where priority 1 does not apply, a parameter takes its value from the node's
  saved configuration when the parameter is not internal, is configurable, and the
  configuration contains a key of that name. A key present with a null value counts
  as supplied (CFG-7). A parameter that fails this test falls through to priority 3
  (CFG-6).

posture: normative-target
level: core
