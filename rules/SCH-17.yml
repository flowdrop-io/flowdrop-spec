id: SCH-17
family: GR-SCHEMA
part: I

title: The unified input port

normative: >-
  A unified `input` port MUST be prepended to a node's ports where its node type
  exposes one. It MUST carry the `json` lane. Its description MUST enumerate the
  node's connectable parameter keys only.

posture: normative-target
level: extended
