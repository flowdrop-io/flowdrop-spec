id: PLAY-2
family: RT-PLAY
part: II

title: Creating a session answers the same row the list publishes
summary: >-
  A client can insert a creation response straight into its list without
  re-fetching, which is what makes one shared row shape load-bearing rather than
  tidy.

normative: >-
  Creating a session MUST answer `201`. Reading a session MUST answer `200`. Both
  MUST answer under `{success, data}`, and in both cases `data` MUST be the same row
  the session list publishes in its `data[]`. That row MUST carry `id`, `workflowId`,
  `name`, `status`, `createdAt`, `updatedAt`, `metadata`, `executions` and `owner`.
  `owner` MUST carry `id` and `name`. `createdAt` and `updatedAt` MUST be ISO 8601
  strings, not numeric timestamps. `executions` MUST be an empty array, not null, for
  a session that has never run.

posture: normative-target
level: core
profiles:
