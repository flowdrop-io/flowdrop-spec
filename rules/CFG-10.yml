id: CFG-10
family: GR-CFG
part: I

title: A resolved value is validated against the parameter schema

normative: >-
  A resolved value that is not `null` MUST be validated against the parameter's schema.
  Any violation MUST fail the node execution with a validation error carrying the name
  of the constraint that failed. `type` and `enum` MUST be checked first, and either one
  failing MUST end the check there. A value that resolves to `null` MUST NOT be
  validated, even where the schema's `type` does not admit `null`. Whether a `null` is
  acceptable is decided by `required` alone (CFG-9). This is a named exception to JSON
  Schema, which checks a `null` like any other value (Conventions, Absent, null and
  empty).

posture: normative-target
level: core
profiles:
