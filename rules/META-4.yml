id: META-4
family: RT-META
part: II

title: The workflow schema endpoint publishes a bare document
summary: >-
  A workflow's declared input and output ports, read by an editor before it can
  draw the workflow. It is not wrapped in the standard envelope, and its
  snake_case is as much a contract as the playground's camelCase.

normative: >-
  The body of a successful read of a workflow's schema MUST carry
  `schema_version`, `parameter_schema` and `output_schema`, spelled in snake_case.
  The body MUST NOT carry a `success` key or a `data` wrapper. `parameter_schema`
  and `output_schema` MUST be the stored snapshot verbatim. Where a workflow
  declares no ports, they MUST be JSON `null`, not an empty object and not
  omitted, so a consumer can distinguish "no ports" from "key missing".

posture: normative-target
level: core
profiles:
