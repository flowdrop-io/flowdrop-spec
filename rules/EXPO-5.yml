id: EXPO-5
family: GR-EXPO
part: I

title: Only an exact false suppresses default exposure

summary: >-
  Withdrawn (OPEN-33): how an implementation arrives at a port's stated default exposure is its own business.

normative: >-
  A processor's `x-exposed-by-default` schema extension could suppress a port's default
  exposure. The specification no longer defines the keyword: every port states its
  default exposure in the node type's metadata (CFG-2), however the implementation
  arrived at it.

posture: withdrawn
level: core
