id: CFG-3
family: GR-CFG
part: I

title: A parameter's effective default comes from the node type, then the schema

normative: >-
  A parameter's effective default MUST be the node type's recorded default where the
  node type records one, a recorded `null` included. A node type records a default when
  its default member is present; an absent member records none. Where the node type
  records none, the effective default MUST be the processor's schema default, where the
  schema declares one, a `null` default included. Where neither records a default, the
  parameter has no effective default.

posture: normative-target
level: core
profiles:
