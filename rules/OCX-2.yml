id: OCX-2
family: RT-OCX
part: II

title: External results are retrieved by polling, and only by polling
summary: >-
  A contract of omission: the connector dispatches nothing outbound. Widening it
  means taking on delivery, timeouts, retry and de-duplication, which belong
  elsewhere.

normative: >-
  Results of an externally invoked run MUST be retrieved by the caller polling.
  The connector MUST NOT dispatch an outbound request. The connector MUST NOT
  subscribe to a runtime execution event. A run that leaves no persisted record
  is invisible to a poller, so an execution engine that produces one MUST be
  refused for external invocation. The configured choice MUST be reported. The
  run MUST be carried out on a pollable engine instead, rather than silently
  producing a run no caller can ever observe.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

