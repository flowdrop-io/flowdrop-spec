id: LANG-27
family: GR-LANG
part: I

title: A switch compares its value; it does not evaluate it
summary: >-
  Despite the parameter's name, a switch gateway runs no expression engine. The
  value is matched against each branch as it stands.

normative: >-
  A switch gateway MUST NOT evaluate its `expression`. The value MUST be compared
  unchanged against each branch's `value`, in declaration order, with no coercion. A
  branch MUST NOT match unless the two are of the same type and equal. The first
  matching branch MUST be the sole active branch. The gateway MUST report that branch's
  name as active. Where no branch matches, the branch named by `default_branch` MUST be
  active. Where no branch matches and no usable default is named, the node MUST fail.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

