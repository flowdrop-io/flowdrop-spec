id: EDGE-5
family: GR-EDGE
part: I

title: A tool edge is one whose target port is the tool port

summary: >-
  An edge's kind is read from the port it plugs into, never from what the edge says
  about itself. A declared `data.edgeType` is for drawing the line, not for running it.

normative: >-
  An edge MUST be a tool edge when, and only when, its target handle ends with
  `-input-tool`. An edge MUST NOT be treated as a tool edge on any other ground. A
  `data.edgeType` on an edge is an annotation: it MUST NOT change the edge's kind, MUST
  NOT change how the edge is validated, and MUST NOT change how the workflow runs. Its
  value is open: an implementation MUST NOT refuse a workflow for a `data.edgeType` it
  does not recognise.

posture: normative-target
level: core
