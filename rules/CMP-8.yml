id: CMP-8
family: RT-CMP
part: II

title: Execution order is a topological order, and no more than that
summary: >-
  Two nodes with no dependency between them can run in either relative order. An
  edge is how an author makes one come before the other.

normative: >-
  The execution order MUST be a topological order of the execution dependencies: a
  node MUST NOT precede a node it depends on. The relative order of nodes with no
  dependency relation between them is not specified. An author MUST NOT rely on it.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

