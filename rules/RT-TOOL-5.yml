id: RT-TOOL-5
family: RT-TOOL
part: II

title: Artifact collection is opened and released per run

summary: >-
  Collecting artifacts means holding payloads in memory, so the run that opens
  collection is the run that ends it, on every way out.

normative: >-
  An implementation MAY omit collecting tool artifacts altogether. Where it
  collects them, it MUST NOT retain an artifact unless collection is open for the
  run the artifact belongs to. An artifact arriving for a run whose collection was
  never opened MUST be dropped. Draining what has been collected MUST NOT end
  collection, and a later tool call in the same run MUST still collect. Only
  releasing collection ends it, and an artifact arriving after release MUST be
  dropped. Collection is opened and released on the same path. A run that returns,
  pauses or fails MUST release collection, so it cannot retain artifacts beyond
  its own life. Whether artifacts are collected MUST NOT depend on which entry
  point launched the run.

posture: normative-target
level: optional
profiles:
  - runtime

added: "1.0"
changed: "1.0"

rulings:
  - OPEN-25
