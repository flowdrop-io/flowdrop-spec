id: ERR-6
family: RT-ERR
part: II

title: A node's output is serializable throughout
summary: >-
  Checked over the node's whole output, before any unexposed value is filtered out, so
  a value the node type does not expose is policed exactly like one it does.

normative: >-
  Every leaf of a node's output MUST be a JSON value: a string, number, boolean, null,
  an array, or an object with a defined JSON representation. The check MUST cover the
  node's full output, including values its type does not expose. A violation MUST be a
  node-level error naming the node, its type, the dotted path to the offending leaf
  and the offending type. The resulting error output MUST NOT be retryable. The
  resulting error output MUST follow the ordinary error-edge-or-fail path.

posture: normative-target
level: extended
profiles:
  - runtime

