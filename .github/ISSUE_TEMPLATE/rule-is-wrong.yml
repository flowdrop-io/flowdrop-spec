name: A rule is wrong
description: A rule states something that is mistaken, unimplementable, or not what was intended.
labels: ["defect"]
body:
  - type: markdown
    attributes:
      value: >-
        This is the most valuable report you can file here. You do not need to
        propose a fix.
  - type: input
    id: rule
    attributes:
      label: Rule identifier
      placeholder: STORE-2
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Quote the sentence and say what it gets wrong.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: How you found it
      description: >-
        Implementing it, reading it, a test disagreeing with it — whatever it was.
        Helps us see which rules are hard to read.
