id: ORC-10
family: RT-ORC
part: II

title: A run has a scheduler budget, and exhausting it pauses rather than fails
summary: >-
  This budget counts scheduler passes across the whole run. It is not a per-loop round
  count and not the hard safety valve; the three exist separately and resolve
  differently on resume.

normative: >-
  A run MUST be bounded by a maximum number of scheduler passes, defaulting to 100, and a
  maximum execution time. Exhausting either MUST break the loop and pause the run with the
  reason recorded; exhausting either also raises a pending system pause signal. A paused
  run MUST be resumable, and MUST resume with a fresh budget. Re-entry MUST clear a stale pause
  reason. This budget MUST be shared by every loop in the workflow and MUST reset on
  resume, which is what makes a budget-paused run resumable. A per-loop round count is a
  separate bound; it MUST be restored from the run's own record and MUST keep accumulating
  across resumes.

posture: normative-target
level: core
profiles:
