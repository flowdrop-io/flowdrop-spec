id: R13
family: GR-VAL
part: I

title: Two identical edges between the same ports are refused

summary: >-
  Duplicate detection compares what the document literally says, not what it
  means. Two spellings of the same logical connection are therefore two
  distinct edges, and both are kept.

normative: >-
  Two edges are duplicates when their `source`, `target` and both handles are identical.
  A duplicate MUST be refused with `R13_EDGE_PARALLEL_DUPLICATE` at `edge.{index}`, and
  the error MUST name the position of the earlier edge it duplicates. The four values
  MUST be compared verbatim, with no parsing or normalisation of a handle into a port
  name. Two edges between the same pair of nodes over different ports therefore stay
  valid. Two edges over the same logical port written differently, one with the handle
  absent and one with it spelled out, are both accepted. An absent handle and an empty
  one are different values. An edge whose source or target is absent or empty MUST take
  no part in the comparison.

posture: normative-target
level: core
profiles:
