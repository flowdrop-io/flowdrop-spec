id: LANG-8
family: GR-LANG
part: I

title: A property path that cannot be read is a miss, not a null
summary: >-
  Property paths never raise. A path that cannot be read is a miss, and a reader can
  tell it apart from a path that reads a stored null, as LANG-24 needs.

normative: >-
  Property-path evaluation MUST NOT raise. A path that cannot be read MUST be a miss: it
  yields no value, and the evaluation MUST report that nothing matched. A path that
  reads a stored `null` MUST yield `null` and report a match.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

