id: R4.c
family: GR-VAL
part: I

title: A bound exposure entry names a node that exists

normative: >-
  A bound workflow exposure entry's `node_id` MUST name a node in the workflow. An entry
  that does not MUST be refused at `schema.{side}.{index}`, and the entry's remaining
  checks MUST be skipped, since none of them can be decided without the node. An entry
  that carries only one of `node_id` and `port` MUST be refused the same way. An unbound
  entry names no node, and MUST NOT be refused for it.

posture: normative-target
level: core
profiles:
  - storage-api

added: "1.0"
changed: "1.0"

