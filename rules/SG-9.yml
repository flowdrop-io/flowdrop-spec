id: SG-9
family: RT-SG
part: II

title: An edge condition never decides routing

normative: >-
  A condition stored on an edge MUST NOT gate dispatch: not on any edge, and not
  on a loopback edge, the one place dispatch genuinely decides. The edge MUST be
  stored. The edge MUST be followed. A warning MUST be reported for it once per
  edge each time its source's outgoing edges are resolved.

posture: normative-target
level: core
profiles:
  - runtime

