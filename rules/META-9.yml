id: META-9
family: RT-META
part: II

title: The editor metadata endpoints are read-only and gated before the handler
summary: >-
  Neither endpoint has a handler-side check to fall back on, so what the surface
  declares is the whole access contract.

normative: >-
  The category endpoint and the workflow schema endpoint MUST accept `GET`.
  Each MUST NOT accept any other method. Each MUST require a named authorization
  decided before the handler runs; neither carries a handler-side check as a
  backstop. The set of methods and the named authorization are part of the
  contract (widening either is a visible change). A named authorization the
  implementation does not define is a defect, not a restriction.

posture: normative-target
level: extended
profiles:
  - runtime
  - editor-client

added: "1.0"
changed: "1.0"

