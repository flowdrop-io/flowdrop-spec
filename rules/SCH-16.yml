id: SCH-16
family: GR-SCHEMA
part: I

title: A node type states which reserved ports start hidden

normative: >-
  A node type that declares one of the reserved ports the unified `input` and
  `output`, the `tool` output, the `error` output or the `loop_back` input MUST
  state `exposedByDefault: false` for it, unless it means that port to be exposed
  by default. The `trigger` input and the `trigger` output need no statement:
  unstated, they are exposed (CFG-2), as every port is.

posture: normative-target
level: core
profiles:
