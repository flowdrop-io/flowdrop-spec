id: STORE-9
family: GR-STORE
part: I

title: Import gates run in a fixed order and roll back what they generated

summary: >-
  Importing a bundle can create node types before it knows whether the workflow is
  acceptable. The fixed order, and the rollback, are what keep a refused import from
  leaving debris behind.

normative: >-
  A bundle import MUST apply its gates in this order: envelope format, publisher trust,
  capability manifest, node-type generation, workflow validation, flow-id shape, id
  collision. Any refusal after node-type generation MUST roll the generated node types
  back, so that a refused import leaves nothing behind. An unsupported envelope format
  MUST be refused with 422. An untrusted publisher MUST be refused with 403, unless the
  caller both confirms the publisher and is permitted to do so. A processor the
  installation does not have MUST be refused with 422. That refusal MUST be reported ahead
  of validation, so that a missing processor is actionable rather than surfacing as a
  structural error. A workflow that fails validation MUST be refused with 422 and
  `details`. An id that already exists MUST be refused with 409, and the existing workflow
  MUST NOT be overwritten. A non-empty flow id MUST match `^[a-z0-9_]+$`. A non-empty flow
  id MUST be at most 64 characters. An empty flow id MUST be accepted, and one MUST be
  minted. Every refusal MUST carry at least one `details` entry identifying the cause. A
  flow-id refusal MUST locate itself at `flow.id`. Exposure entries are normalised before
  validation for every bundle, a trusted one included: an entry keeps only its `name`,
  `node_id` and `port`, and only where those are scalar, cast to string; an entry that is
  not an object, or is wholly malformed, becomes empty but keeps its index, so validation
  reports it against its own position instead of shifting every later one. What is stored
  MUST be the entry as submitted, so an author's additional entry metadata survives the
  import.

posture: normative-target
level: extended
