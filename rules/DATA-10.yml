id: DATA-10
family: RT-DATA
part: II

title: A tool edge binds a tool, it does not deliver data

normative: >-
  An edge on the reserved `tool_availability` port MUST make the source's tools
  available to its target as tool bindings. It is not a data delivery, so it MUST
  NOT fill any input port. Where a node forwards the tools it received rather than
  providing its own, the forwarding MUST NOT form a cycle. A workflow in which it
  does MUST be refused.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

