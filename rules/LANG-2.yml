id: LANG-2
family: GR-LANG
part: I

title: A node's expression engine is one the implementation provides

normative: >-
  A node that embeds an expression MUST select its engine through the reserved `engine`
  parameter. The parameter's permitted values are the engine identifiers the
  implementation provides. A workflow naming an engine outside that set MUST be refused
  when it is saved. It MUST be refused again when the parameter is resolved. An
  unrecognised engine identifier that reaches evaluation by some other route MUST fail
  before any expression is evaluated.

posture: normative-target
level: core
profiles:
  - storage-api
  - runtime

added: "1.0"
changed: "1.0"

