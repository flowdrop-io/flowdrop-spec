id: MAN-6
family: GR-MAN
part: I

title: The author's words win over the node's
summary: >-
  A node's own annotation describes the port in general. The author describes what
  this workflow means by it, so the author's text is the one a caller sees.

normative: >-
  Author-supplied metadata on a manifest entry MUST be overlaid onto the contract
  fragment after the fragment has been reduced. It MUST override any annotation the
  bound port declares. The overlay MUST apply to the input side only. An absent member
  MUST leave the port's own annotation in place. A present member MUST be overlaid, an
  empty one included. A member sent as `null` MUST remove the port's annotation.

posture: normative-target
level: extended
profiles:
  - storage-api

added: "1.0"
changed: "1.0"

rulings:
