id: SCH-13
family: GR-SCHEMA
part: I

title: A tool-exposed node gets a tool output

normative: >-
  A reserved `tool` output port MUST be injected on a node type if and only if that
  node type is exposed as a tool. The injected port MUST carry display order 110.

posture: normative-target
level: extended
profiles:
  - storage-api
  - editor-client

