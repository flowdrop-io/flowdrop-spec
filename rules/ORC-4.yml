id: ORC-4
family: RT-ORC
part: II

title: State graph is the interactive-session default only
summary: >-
  It is a caller's default, offered by the session surface, not a rung in the global
  chain, so a background run never silently becomes a state-graph run.

normative: >-
  The state graph strategy MUST be the default for interactive session and playground
  execution, and MUST NOT be applied as that default where the session or the workflow
  declared a strategy. The general resolution chain MUST NOT resolve to it.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

rulings:
  - OPEN-25

related:
  - ORC-2
