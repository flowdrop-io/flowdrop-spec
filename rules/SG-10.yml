id: SG-10
family: RT-SG
part: II

title: A loopback driven from the trigger port belongs to no branch

normative: >-
  Where a loopback edge's source is the reserved `trigger` port, the re-entry it
  drives MUST be attributed to no branch.

posture: normative-target
level: extended
profiles:
