id: R6.i
family: GR-VAL
part: I

title: A null config value is present, and its schema decides whether it is acceptable

normative: >-
  A config value of `null` is present, with no value. It MUST satisfy a required key. It
  MUST be validated against the key's schema as JSON Schema validates it: it MUST fail
  `type` unless the type admits `null`, and MUST fail `enum` unless the enumeration
  lists `null`. Constraints that apply only to strings, numbers, arrays or objects, such
  as bounds and `pattern`, do not apply to a `null`.

posture: normative-target
level: core
