id: LANG-9
family: GR-LANG
part: I

title: A JSONPath query never raises; it falls back to the caller's default

normative: >-
  JSONPath evaluation MUST NOT raise. A query that is well-formed but matches nothing,
  and a query that cannot be compiled or cannot be run, MUST both be a miss: they yield
  the default the caller supplied, `null` where none was supplied, and the evaluation
  MUST report that nothing matched. The two kinds of miss MAY be indistinguishable to
  the caller. A query that matches a `null` MUST yield `null` and report a match, never
  the default.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

