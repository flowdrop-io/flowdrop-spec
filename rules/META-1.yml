id: META-1
family: RT-META
part: II

title: The category list is the standard envelope, and its name is a machine name
summary: >-
  This is the list that fills an editor's node sidebar. A consumer that treats
  `name` as human-readable renders a machine name to an author.

normative: >-
  The category list MUST answer the standard `{success, data}` envelope. A
  cacheable response MUST carry byte-identical envelope keys to a non-cacheable
  one, and an endpoint MUST NOT hand-build a body to avoid it. `data` MUST be an
  array of rows, each carrying `name`, `label`, `icon`, `color` and `description`,
  every value a string. `name` is the category's identifier, not a display name. A
  row MUST NOT carry a separate `id` key. The response MUST publish only enabled
  categories, and a disabled one MUST be absent rather than flagged, so a consumer
  cannot distinguish it from a deleted one.

posture: normative-target
level: core
profiles:
  - runtime
  - editor-client

added: "1.0"
changed: "1.0"

rulings:
