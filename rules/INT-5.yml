id: INT-5
family: RT-INT
part: II

title: Cancel and pause signals are observed between job iterations

summary: >-
  A signal never interrupts a job mid-flight. It is observed at the boundary
  between iterations, which is why a cancelled run has no half-executed node.

normative: >-
  An engine polls for a pending signal between job iterations; the in-flight job
  always finishes first, and the absence of a signal continues the loop. A cancel
  signal marks the run cancelled, stamps its execution time, and announces the
  outcome twice — a cancellation event and a run-completed announcement carrying
  the cancelled status, so that cancellation is announced like any other terminal
  outcome (ORC-15) — then answers with status `cancelled` and metadata naming the
  engine, the signal and the reason. A pause signal pauses the run and announces
  only the pause, with no completion announcement, answers with status `paused` and
  the same metadata keys, and leaves the signal record pending, because that record
  is the run's resume key.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

