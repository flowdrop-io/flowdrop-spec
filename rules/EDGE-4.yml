id: EDGE-4
family: GR-EDGE
part: I

title: A loopback edge targets the port named loop_back

normative: >-
  An edge MUST be a loopback edge when, and only when, its target handle ends with
  `-input-loop_back`. The reserved port name is `loop_back`. A handle ending with
  `-input-loopback` MUST be an ordinary edge.

