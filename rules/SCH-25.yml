id: SCH-25
family: GR-SCHEMA
part: I

title: Enrichment anchors on the node type and changes nothing else

normative: >-
  A node MUST be enriched from the node type it records, and from nothing else.
  Enrichment MUST replace the node's metadata. Enrichment MUST set the node's type to
  the universal node constant. Enrichment MUST leave the node's config, id, label and
  position untouched, so running it twice changes nothing. Where the node records no
  node type, or where the node type cannot be built, the node MUST be returned
  unchanged and no metadata key MUST be added to it.

posture: normative-target
level: core
profiles:
  - storage-api
  - editor-client

added: "1.0"
changed: "1.0"

