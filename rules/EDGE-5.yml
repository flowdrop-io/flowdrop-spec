id: EDGE-5
family: GR-EDGE
part: I

title: A declared edge type wins over the handle, if it is recognised

summary: >-
  An edge can name its own kind instead of leaving it to the handles. Because a named
  kind overrides what the handles say, a name nobody recognises is refused rather than
  carried through.

normative: >-
  An edge MUST be a tool edge when its declared `data.edgeType` is `tool_availability`,
  or, where the declaration is absent, when its target handle ends with `-input-tool`. A
  recognised declaration MUST decide in both directions: a declared `tool_availability`
  makes an edge with an ordinary handle a tool edge, and any other recognised
  declaration makes an edge with a `-input-tool` handle not one. Only an absent
  declaration falls back to the handle. A declaration that is present but not a
  recognised type, the empty string, `null` and any value that is not a string included,
  MUST be refused at save with a validation error. An implementation MUST NOT carry an
  unrecognised type through as a kind of its own, where it matches nothing and so is
  neither classified nor excluded, and a mistyped kind silently becomes an ordinary
  ordering edge.

posture: normative-target
level: core
profiles:
