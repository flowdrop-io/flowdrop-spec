id: R6.c
family: GR-VAL
part: I

title: An unknown config key warns but does not block

normative: >-
  A key in a node's `config` that the node's derived config schema does not declare MUST
  NOT cause the save to be refused: the workflow is stored. It MUST yield a warning at
  `node.{id}.config.{key}` saying the value is ignored at execution.

posture: normative-target
level: extended
profiles:
  - storage-api
  - editor-client

added: "1.0"
changed: "1.0"

rulings:
