id: LANG-13
family: GR-LANG
part: I

title: Twig validation is a compile check only

normative: >-
  Validating a Twig template MUST compile it. A template that compiles but fails only
  while rendering MUST validate successfully.

posture: normative-target
level: extended
profiles:
  - storage-api

