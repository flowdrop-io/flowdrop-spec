id: CFG-11
family: GR-CFG
part: I

title: Type checking matches exactly and never coerces

normative: >-
  A `type` check MUST judge the value as JSON Schema's `type` keyword does. A value of
  the wrong type MUST fail, and MUST NOT be converted to make it pass. A `type` that
  names no JSON Schema type makes the schema invalid: that is the node type's failure
  (SCH-24), and the value is neither passed nor failed on account of it.

posture: normative-target
level: core
