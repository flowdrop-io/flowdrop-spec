id: EDGE-7
family: GR-EDGE
part: I

title: A tool-only node is excluded from the execution graph

normative: >-
  A node is tool-only when it has at least one outgoing edge and every one of its
  outgoing edges is a tool edge. A node with no outgoing edges is not tool-only, and
  neither is one with any non-tool outgoing edge. A tool-only node MUST be excluded from
  the compiled execution graph. The reason recorded for the exclusion is `tool_only`. A
  tool-only node MUST NOT generate a job. A tool-only node MUST NOT run except inline,
  when a consumer invokes it as a tool.

posture: normative-target
level: extended
profiles:
  - storage-api
  - runtime

