id: R5.b
family: GR-VAL
part: I

title: A workflow is bounded to 1000 edges

normative: >-
  A workflow must not contain more than 1000 edges. A workflow that does is
  refused with the error code `R5_TOO_MANY_EDGES`, and the save does not take
  effect.

posture: normative-target
level: core
profiles:
  - storage-api

