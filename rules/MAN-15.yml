id: MAN-15
family: GR-MAN
part: I

title: Launch inputs are checked in one fixed order and answered once
summary: >-
  A caller gets one problem to fix at a time, in the order that makes the next
  attempt useful: what you sent that does not exist, then what you did not send,
  then what is wrong with what you sent.

normative: >-
  Launch inputs MUST be checked in three stages (keys that are not declared inputs,
  then required inputs that are absent, then the values themselves). The check MUST
  stop at the first stage that fails, and return one message. Every message MUST end
  by naming the inputs the workflow does accept, or by stating that it accepts none.
  An input MUST count as required when its manifest entry says so, or when its name
  appears in the published contract's top-level array of required names; either source
  is sufficient. A manifest written before the contract was last rebuilt is therefore
  still enforced.

posture: normative-target
level: core
