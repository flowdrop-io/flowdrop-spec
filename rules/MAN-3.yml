id: MAN-3
family: GR-MAN
part: I

title: However the manifest was written, one validator refuses a bad entry
summary: >-
  An authoring surface can offer only the ports it knows are valid; an API caller
  submits whatever it likes. Both land on the same stored shape, so the refusal
  lives in one place.

normative: >-
  A manifest MAY be written through more than one way in: an authoring surface that
  offers the author a filtered choice of ports, or an API mapping a caller-supplied
  contract. Both write the same stored shape, and the same workflow validation MUST
  apply to both. An entry naming an unknown node, or a port the instance hides, MUST
  be refused whichever way in submitted it. Exposure MUST be resolved the same way in
  both cases: an instance-level port setting overrides the port's declared default,
  and a port with neither is exposed.

posture: normative-target
level: extended
profiles:
