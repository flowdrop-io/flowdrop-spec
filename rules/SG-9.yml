id: SG-9
family: RT-SG
part: II

title: An edge condition never decides routing

normative: >-
  A condition stored on an edge never gates dispatch — not on any edge, and not on
  a loopback edge, the one place dispatch genuinely decides. The edge is stored,
  the edge is followed, and a warning is reported for it once per edge each time
  its source's outgoing edges are resolved.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

