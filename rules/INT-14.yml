id: INT-14
family: RT-INT
part: II

title: A terminal snapshot is not resumable

summary: >-
  A finished run stays finished. Resuming from a snapshot of one would re-fire
  side-effecting nodes against a run whose outcome is already recorded and already
  announced.

normative: >-
  A snapshot whose status is terminal — completed, failed or cancelled — must not
  be resumed. An engine offered one refuses before creating a run, naming the
  snapshot and its status; the same refusal covers explicit resumption from a
  checkpoint capturing terminal state, naming the checkpoint. Continuing a
  conversation thread is not resumption and is not gated: restoring a thread's
  latest state to seed a new turn carries accumulated conversation state forward
  and is permitted whatever the previous turn's outcome.

posture: normative-target
level: core
profiles:
  - runtime

