id: R8.c
family: GR-VAL
part: I

title: Two dangling ends are two errors

normative: >-
  An edge whose `source` and `target` are both missing MUST yield two errors, one for
  each end, both at the same `edge.{index}` locator. The two ends MUST be judged
  independently, so neither failure suppresses the other.

posture: normative-target
level: extended
