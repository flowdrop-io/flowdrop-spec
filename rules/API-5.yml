id: API-5
family: GR-API
part: I

title: The paginated envelope is a third envelope, with four fixed pagination keys

summary: >-
  Two envelopes carry a result and a refusal. A paginated result is a third, and its
  pagination block belongs to the envelope rather than to the rows it sits beside.

normative: >-
  Alongside `{success, data}` and `{success, error}`, a paginated response MUST be
  `{success, data, pagination}`. `pagination` MUST carry `total`, `limit`, `offset`
  and `has_more`, and nothing else: its members are a closed list, because one block
  is shared by every paginated endpoint, and a member one endpoint adds would make it
  that endpoint's own block. `has_more` MUST be page arithmetic, `(offset + limit) < total`, and
  not a second query. It MUST be spelled `has_more` in every paginated response,
  whatever the spelling convention of that endpoint's rows. It belongs to the shared
  envelope, and an implementation MUST NOT rename it to match the rows beside it. An
  endpoint MUST NOT build a pagination block of its own.

posture: normative-target
level: core
profiles:
  - storage-api

