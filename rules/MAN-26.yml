id: MAN-26
family: GR-MAN
part: I

title: Each trigger node gives the workflow a reserved input
summary: >-
  A firing reaches a run through the same mapping a caller's input does, without the
  author declaring anything and without the entry ever going stale.

normative: >-
  For each trigger node in a workflow, the workflow MUST have one reserved input. Its
  name MUST be `event:` followed by the trigger node's identifier. It MUST bind that
  node's `event` port (SCH-47). A reserved input MUST be derived from the workflow's
  trigger nodes whenever it is needed. A reserved input MUST NOT be stored in the
  workflow's manifest, and an authoring surface MUST NOT write one there. A value
  supplied under a reserved input name MUST be delivered as MAN-11 delivers a declared
  input. A reserved input MUST NOT be required at launch.

posture: normative-target
level: extended
profiles:
  - storage-api
  - runtime
  - editor-client

added: "1.0"
changed: "1.0"

