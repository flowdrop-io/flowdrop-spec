id: R4.b
family: GR-VAL
part: I

title: Exposure names are unique per side

normative: >-
  Workflow exposure names MUST be unique within a side. Inputs and outputs are
  independent: a name MUST NOT be refused for appearing once as an input and once as an
  output. A repeat within one side MUST be refused with `R4_NAME_DUPLICATE` at
  `schema.{side}.{index}`.

posture: normative-target
level: core
profiles:
  - storage-api

added: "1.0"
changed: "1.0"

rulings:
  - OPEN-25

related:
