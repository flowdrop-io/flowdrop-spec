id: ERR-8
family: RT-ERR
part: II

title: An error with nowhere to go fails the run
normative: >-
  Where a node produces an error output and has no error edge, its unit of work MUST
  be recorded as failed. That unit of work MUST NOT be marked as error-routed. The run
  MUST fail.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

