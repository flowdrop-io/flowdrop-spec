id: PLAY-4
family: RT-PLAY
part: II

title: One message row, three endpoints, base keys always present

normative: >-
  The message list, the single-message read and the send acknowledgement MUST
  publish the same message row. Its base keys (`id`, `sessionId`, `role`, `content`,
  `timestamp`, `status`, `sequenceNumber`, `nodeId`, `metadata`) MUST always be
  present. The lineage and presentation keys `hierarchy`, `tags`, `display`,
  `toolArtifacts`, `parentMessageId`, `executionId`, `rootPipelineId` and
  `parentPipelineId` MUST be present only when the message carries them. They MUST be
  absent otherwise, not present and null. The single-message read MUST resolve lineage
  on the same terms as the list, so its row is not a lesser one. `timestamp` MUST be
  an ISO 8601 string. The lightweight message status read is a different document
  from this row. It MUST carry `id`, `status`, `sequenceNumber` and `timestamp`.

posture: normative-target
level: core
