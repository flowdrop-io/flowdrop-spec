id: SNAP-1
family: RT-SNAP
part: II

title: The snapshot API carries two casings, and acceptance is the lenient half
summary: >-
  Envelope keys are snake_case and the snapshot document inside them is
  camelCase, so `execution_id` and `executionId` are published by the same read
  one nesting level apart. Both are read by consumers; neither may be normalised
  toward the other.

normative: >-
  The snapshot API's envelope-level keys are snake_case: the save acknowledgement
  `{entity_id, execution_id}`, the delete acknowledgement `{message,
  execution_id}`, and the list row `{entity_id, execution_id, workflow_id,
  status, thread_id, created, changed, node_count}` in that order. The snapshot
  document published under `data.snapshot` is the snapshot's own camelCase shape:
  `workflowId`, `executionId`, `nodeStates`, `initialInput`, `iterationCount`,
  `threadId`, `createdAt`, `updatedAt`. The save door accepts either spelling in
  its body and normalises; a read always answers camelCase. `node_count` is the
  number of node states in the snapshot, not a count taken from the raw stored
  payload.

posture: normative-target
level: core
profiles:
  - runtime
  - editor-client

