id: MEM-2
family: GR-MEM
part: I

title: An assistant turn is a duplicate only when every call it declares is known
summary: >-
  The assistant side of the same guard. Dropping a turn that declares one new
  call would lose that call, so a partial overlap is kept.

normative: >-
  An `assistant`-role message that declares at least one tool call id MUST be
  dropped as a duplicate when every tool call id it declares is already declared
  somewhere in the buffer. An `assistant`-role message that declares at least one
  tool call id not yet seen MUST be appended. An `assistant`-role message that
  declares no tool call id MUST NOT be dropped as a duplicate.

posture: normative-target
level: extended
profiles:
  - storage-api
  - runtime

