id: MAN-1
family: GR-MAN
part: I

title: A workflow's launch inputs are declared, never inferred
summary: >-
  The launch surface is the author's decision, written down. If it were derived
  from what the nodes happen to expose, adding a parameter to a node would widen
  what the outside world can send.

normative: >-
  The inputs a caller can supply when launching a workflow MUST be a manifest the
  author declared on the workflow. They MUST NOT be derived from port exposure. A
  declared entry MUST be built into the workflow's contract even when the instance
  hides the port it names. A port that is exposed but that no manifest entry binds MUST NOT
  reach the contract.

posture: normative-target
level: core
profiles:
  - storage-api

