id: ORC-12
family: RT-ORC
part: II

title: Asynchronous execution returns immediately
normative: >-
  Asynchronous execution returns the status `queued` to its caller immediately and
  executes no node in the calling request. It may seed the run from a snapshot of
  already-completed work.

posture: normative-target
level: core
profiles:
  - runtime

