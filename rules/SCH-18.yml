id: SCH-18
family: GR-SCHEMA
part: I

title: The unified output port

normative: >-
  A unified `output` port MUST be prepended to a node's ports where its node type
  exposes one. It MUST carry the `json` lane. Its description MUST enumerate the
  node's exposed output keys only.

posture: normative-target
level: extended
