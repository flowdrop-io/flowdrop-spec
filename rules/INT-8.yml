id: INT-8
family: RT-INT
part: II

title: Snapshot validation reports named errors and non-fatal warnings

summary: >-
  Validating a snapshot against a workflow definition answers with codes a caller
  can act on, and draws a hard line between what invalidates a snapshot and what is
  merely worth saying.

normative: >-
  Validating a snapshot against a workflow definition yields a result carrying
  named codes. Errors, each of which makes the result invalid: a version mismatch,
  raised only when the snapshot's workflow version is non-empty — an empty version
  skips the check and is not an error; one unknown-node error per snapshot node
  absent from the definition; and one dependency-not-met error per completed node
  whose dependency has no recorded state or is neither completed nor skipped.
  Warnings, which never make the result invalid: one per definition node missing
  from the snapshot, and one per completed injected node that has dependencies.

posture: normative-target
level: extended
profiles:
  - runtime

