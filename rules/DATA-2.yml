id: DATA-2
family: RT-DATA
part: II

title: Several sources on one port resolve to a single latest value

summary: >-
  A merge point in a workflow is not a collector. A port fed by three edges is
  still one port, and what a node reads there is one value.

normative: >-
  A port fed by several edges MUST receive exactly one value, and MUST NOT receive
  an array of the values. The value MUST be the one produced by the most recent
  execution among the sources. A source carrying a later execution order MUST win. A
  source carrying an execution order MUST win over one carrying none. Where neither
  carries one, the source node identifier MUST decide, lexicographically. A
  collision between sources on one port MUST be reported as a warning, and MUST NOT
  fail the run.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

