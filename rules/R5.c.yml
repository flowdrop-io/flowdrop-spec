id: R5.c
family: GR-VAL
part: I

title: Every node carries an id

summary: >-
  A node without an id cannot be referred to by an edge, an exposure entry or a
  runtime result, so a workflow containing one is refused rather than stored.

normative: >-
  Every node in a workflow MUST carry a non-empty `id`. A node whose `id` is absent or
  empty MUST be refused, and because the node cannot be named the error MUST identify it
  by its position in the workflow's `nodes` array.

posture: normative-target
level: core
profiles:
  - storage-api

