id: SCH-6
family: GR-SCHEMA
part: I

title: Which required array a required parameter lands in

normative: >-
  A required parameter MUST be emitted into the input schema's `required` array if and
  only if it is not `configurable`. A required parameter MUST be emitted into the
  config schema's `required` array if and only if it is not `connectable`.

posture: normative-target
level: core
