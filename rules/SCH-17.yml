id: SCH-17
family: GR-SCHEMA
part: I

title: The unified input port

normative: >-
  A unified `input` port is prepended to a node's ports where its node type exposes
  one. It carries the `json` lane, and its description enumerates the node's
  connectable parameter keys only.

