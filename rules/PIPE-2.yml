id: PIPE-2
family: RT-PIPE
part: II

title: The job status summary has one shape on every path

normative: >-
  A run's `job_status_summary` MUST carry `total` and one integer counter per
  defined job status, with no status omitted. The same key set MUST be published
  when the jobs are read successfully, when the run cannot be found, and when the
  read fails. In the latter two cases every counter MUST be zero. The job API's own
  `status_summary` MUST publish that same shape.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

