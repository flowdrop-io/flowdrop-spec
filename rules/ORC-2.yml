id: ORC-2
family: RT-ORC
part: II

title: How the execution strategy for a run is resolved
summary: >-
  Every configured step is checked before it is honoured, so an engine that is
  configured but not available cannot capture the default and strand a run.

normative: >-
  The strategy for a run MUST be resolved in this order: a run started from a pre-save
  trigger uses direct synchronous execution; otherwise the strategy configured on the
  trigger; otherwise the strategy configured for the implementation; otherwise
  asynchronous. A configured strategy MUST NOT be accepted unless it validates as usable.
  A step that does not validate MUST be skipped in favour of the next.

posture: normative-target
level: core
profiles:
  - runtime

