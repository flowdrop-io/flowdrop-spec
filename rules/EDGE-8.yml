id: EDGE-8
family: GR-EDGE
part: I

title: A condition on an edge is tolerated, warned about, and ignored
summary: >-
  Withdrawn (OPEN-36): a condition on an edge is a member of the edge's `data`, which carries no execution logic (OPEN-32).

normative: >-
  A stored `edge.data.condition` was accepted, kept and warned about, and gated
  nothing. The specification gives it no rule: like every member of an edge's
  `data`, it carries no execution logic (OPEN-32).

posture: withdrawn
level: extended
