id: DYN-6
family: GR-DYN
part: I

title: Dynamic ports carry no exposure state, and a workflow interface can bind them
summary: >-
  Exposure is a property of a port the processor declares. A dynamic port is not
  declared, so there is nothing to hide and nothing to strip. It is still a port the
  node defines, so a workflow's interface can bind it like any other.

normative: >-
  A dynamic port has no exposure. A dynamic port MUST always be wireable. The value
  of a dynamic port MUST NOT be stripped from a node's output. Edge validation MUST
  NOT raise an exposure objection against a dynamic port. A workflow interface entry
  MUST be able to bind a dynamic port, on the side it is defined for, as it binds a
  declared one (R4.d); having no exposure, the port is never refused as hidden (R10).

posture: normative-target
level: extended
profiles:
  - storage-api
  - runtime

