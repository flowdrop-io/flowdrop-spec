id: ERR-4
family: RT-ERR
part: II

title: An interrupt propagates unchanged
summary: >-
  An interrupt is a request for something outside the run (human input, an external
  resolution), not a failure. Treating it as one would route it down an error edge.

normative: >-
  A node that interrupts MUST set its status to interrupted. The interrupt MUST be
  announced. The interrupt itself MUST propagate unchanged to the caller. The
  interrupt MUST NOT be converted into an error output. The interrupt MUST NOT take an
  error edge.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

