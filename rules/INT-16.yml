id: INT-16
family: RT-INT
part: II

title: A refused signal says why in a code a client can act on

summary: >-
  Three different refusals share one status code, and a client has to tell them
  apart to say anything useful to an operator. The discriminator is a stable code,
  not the wording of a message.

normative: >-
  The signal API refuses in three distinguishable ways, all `409`, each carrying a
  stable machine-readable code beside its human-readable message: the run is in a
  terminal state and cannot be signalled or resumed (`PIPELINE_TERMINAL`); an
  inward signal is already pending for the run (`INWARD_SIGNAL_ALREADY_PENDING`);
  and there is no active pause to resume (`NO_ACTIVE_PAUSE`). A client classifies a
  refusal by that code; the message wording is not a contract and an implementation
  may change it. A refusal answers with the error envelope (API-1). A newly created
  cancel or pause signal answers `202`; a resume that resolved a pending pause
  answers `200`. A signal addressed to a run that does not exist answers `404` to a
  caller holding blanket authority over runs — existence is no secret from someone
  who may act on any run — and an opaque `403` to every other caller,
  indistinguishable from the answer for a run that exists but is not theirs, so
  that the route cannot be used to enumerate which runs exist.

