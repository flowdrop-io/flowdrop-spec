id: MEM-4
family: GR-MEM
part: I

title: Assembling messages concatenates in declared port order
summary: >-
  The node that joins several message sources into one array. Port order is the
  message order, and an unwired source adds nothing at all.

normative: >-
  A message-assembly node MUST flatten any number of dynamically declared
  message-typed inputs into one message-typed output. The messages MUST follow the
  order of the node's dynamic parameter definitions. A connected array MUST
  contribute each of its items in order. A connected single message MUST contribute
  one item. An input that is unwired or carries no value MUST contribute nothing:
  the node MUST NOT emit a placeholder for it.

posture: normative-target
level: extended
