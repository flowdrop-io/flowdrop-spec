id: R6.c
family: GR-VAL
part: I

title: An unknown config key warns but does not block

normative: >-
  A key in a node's `config` that the node's derived config schema does not
  declare does not refuse the save. It yields a warning at
  `node.{id}.config.{key}` saying the value is ignored at execution, and the
  workflow is stored.

posture: normative-target
level: extended
profiles:
  - storage-api
  - editor-client

