id: SCH-16
family: GR-SCHEMA
part: I

title: What each reserved port defaults to on the canvas

normative: >-
  The reserved ports MUST default to not exposed (the unified `input` and `output`,
  the `tool` output, the `error` output and the `loop_back` input), except the
  `trigger` input and the `trigger` output, which MUST default to exposed. A node type
  MAY override the default per port. A node type MUST store only the keys whose value
  diverges from the default.

posture: normative-target
level: core
