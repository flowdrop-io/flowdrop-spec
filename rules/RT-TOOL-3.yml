id: RT-TOOL-3
family: RT-TOOL
part: II

title: Artifacts leave a tool call on their own port, apart from the model's prose

normative: >-
  A node that invokes tools MUST surface every call's artifacts on a dedicated
  `tool_artifacts` output port. Each entry on that port MUST carry `type`,
  `payload` and `tool_call_id` and nothing else, built key by key, so that a tool
  can neither override the real `tool_call_id` nor smuggle keys of its own
  through. That port MUST NOT be exposed by default. The prose fed back to the
  model MUST be built from a result's `data` alone, and never from its artifacts.
  Delivery of a run's artifacts MUST NOT depend on whether the author exposed the
  port.

posture: normative-target
level: extended
profiles:
  - runtime

