id: STORE-15
family: GR-STORE
part: I

title: Searching the workflow list matches a literal substring of the name

summary: >-
  The term is text to find, not a pattern to interpret, so a name containing a
  percent sign is found by searching for a percent sign.

normative: >-
  A list request MAY carry a search term. The list MUST then contain only the workflows
  whose name contains the term, compared without regard to case and matched anywhere in
  the name. The term MUST be matched literally and carries no pattern syntax: `%` and `_`
  match themselves and nothing else. The same filter MUST apply to the count, so the
  reported total describes the filtered set rather than the collection (API-6). A term
  that matches nothing MUST be answered with an empty page and a coherent pagination
  block, not a refusal and not a not-found. A term of `0` MUST be treated as an ordinary
  search term. A search parameter that is not a single scalar value MUST be refused with
  `400`.

posture: normative-target
level: extended
