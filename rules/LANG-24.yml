id: LANG-24
family: GR-LANG
part: I

title: An extraction that matches nothing is a miss; a matched null is delivered
summary: >-
  A path that matches nothing and a path that matches a null give different answers, and
  the extractor keeps them apart, as JSONPath does. Only a miss falls back to the
  default.

normative: >-
  An extraction that evaluates cleanly and matches nothing is a miss. On a miss, the
  configured default MUST be delivered, the extractor MUST report success as `false`,
  and the node MUST succeed. An extraction that matches a `null` MUST deliver `null` and
  report success as `true`. A matched `false`, `0`, `""`, `[]` or `{}` MUST be delivered
  as found, and success reported as `true`.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

rulings:
  - OPEN-25
  - OPEN-26

references:
  informative:
    - source: RFC 9535
      title: "JSONPath: Query Expressions for JSON"
      url: https://www.rfc-editor.org/rfc/rfc9535
      note: >-
        Tells a query that selects no node apart from one that selects a node whose
        value is null. This rule keeps the same distinction for every engine.

related:
  - LANG-8
  - LANG-22
