id: W-T
family: GR-VAL
part: I

title: An edge leaving a terminal node warns

summary: >-
  A terminal node ends the run, so nothing downstream of it will execute. The
  edge is legal (the author might be mid-edit), but it is almost certainly not
  what they meant.

normative: >-
  Every edge whose source node is a terminal node MUST yield one non-blocking warning at
  `edge.{index}`, naming the terminal source and the target it leads to. A terminal node
  with several outgoing edges therefore produces one warning per edge, and the workflow
  stays valid. Only sources are inspected, so a workflow with no edges looks nothing up.
  The target's existence does not matter here: an edge from a terminal node to a deleted
  node MUST produce both this warning and R8's missing-target error. An edge whose
  source is itself dangling MUST NOT produce this warning; R8 owns that.

posture: normative-target
level: extended
