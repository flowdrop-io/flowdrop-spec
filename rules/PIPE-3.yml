id: PIPE-3
family: RT-PIPE
part: II

title: Status vocabulary is guarded in the summary and raw in the node counts
summary: >-
  Two counters in the same payload count the same jobs on different terms, and a
  consumer that reads one as if it were the other draws the wrong conclusion.

normative: >-
  In `job_status_summary` and the job API's `status_summary`, `total` MUST count
  every job. A bucket MUST be incremented only for a persisted value that is a
  defined job status. The buckets can therefore sum to less than `total`. A value
  outside the vocabulary MUST NOT appear as a key there. Each read reports the
  distinct unrecognised values once. The per-node `node_statuses[*].status_counts`
  is not guarded: it MUST count persisted values as they are. A value outside the
  vocabulary MUST therefore appear both as a key there and as
  `node_statuses[*].status`.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

rulings:
