id: SCH-19
family: GR-SCHEMA
part: I

title: A unified port's description skips trigger and hidden keys

normative: >-
  Both unified-port key enumerations skip the `trigger` port and every hidden
  parameter. A hidden port does not exist on the instance, so it never appears in a
  unified port's description.

posture: normative-target
level: extended
profiles:
