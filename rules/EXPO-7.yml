id: EXPO-7
family: GR-EXPO
part: I

title: Published schemas carry the flag only where the default is hidden
summary: >-
  Withdrawn (OPEN-33): how an implementation arrives at a port's stated default exposure is its own business.

normative: >-
  Published schemas carried `x-exposed-by-default: false` where a node type's default
  exposure was hidden. The served port's `exposedByDefault` is the one place the value
  is stated (CFG-2, SCH-27).

posture: withdrawn
