id: R6.h
family: GR-VAL
part: I

title: A pattern mismatch is refused, a broken pattern is not

summary: >-
  A pattern the implementation cannot compile is a defect in the node type, not
  in the workflow, and the author who cannot fix it is not blocked by it.

normative: >-
  A string config value that does not match its schema's `pattern` MUST be refused with
  `R6_CONFIG_INVALID` at `node.{id}.config.{key}`. Where the pattern itself is not a
  valid expression, the value MUST NOT be refused on account of it, and no error is
  charged to the author.

posture: normative-target
level: core
profiles:
