id: SCH-44
family: GR-SCHEMA
part: I

title: A shape refines another declaration of its lane; four ids are reserved

normative: >-
  Where two sources declare the same lane id, the site's own declaration MUST win over
  a code-declared shape, and both MUST win over the shipped entry. The winner MUST
  replace the entry whole rather than key by key, its declared compatibility rules included (SCH-10.a), because a partial shape is a
  deliberate redefinition. A collision with a shipped id is therefore not a break: the
  lane MUST stay in the vocabulary, stay self-compatible, and keep its derived rules.
  Precedence is resolved in one place, so which declaration wins MUST NOT depend on
  load order. The ids `trigger`, `tool` and `mixed` are reserved (every
  generated compatibility rule in the payload is built from them), and a shape naming
  one MUST be ignored rather than treated as fatal, since paths that reach around a
  form exist and one bad shape would otherwise unwire every canvas.

posture: normative-target
level: extended
profiles:
