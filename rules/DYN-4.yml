id: DYN-4
family: GR-DYN
part: I

title: An unconnected dynamic input falls back like any parameter

normative: >-
  A dynamic input (DYN-1) with nothing wired into it MUST fall back as any parameter does
  (CFG-6): it MUST take the `default` its schema declares, where it declares one, and
  otherwise MUST be absent from the node's resolved inputs. A `null` delivered on its
  wire MUST be present with the value `null`. Nothing arriving on the wire is not the
  same as a `null` arriving.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

