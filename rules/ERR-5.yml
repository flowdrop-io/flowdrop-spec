id: ERR-5
family: RT-ERR
part: II

title: A node can stop the run successfully
summary: >-
  Stopping is a deliberate early finish, not a failure. Everything the run had not yet
  done is abandoned, and the run reports success.

normative: >-
  A node MAY stop the whole run. The stop MUST NOT be converted into an error output.
  The node MUST broadcast completed. The node's unit of work MUST be recorded as
  completed. The node's unit of work MUST NOT be recorded as failed. The value the
  stop carries MUST be recorded under the node's result key. All downstream and
  not-yet-started work MUST be abandoned. The run MUST finish with status completed.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

