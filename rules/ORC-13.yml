id: ORC-13
family: RT-ORC
part: II

title: Resuming after an interrupt re-enters through the run's own strategy
normative: >-
  When an interrupt is resolved, the run MUST resume through the strategy the run declared
  and MUST NOT resume through a different one.

posture: normative-target
level: extended
profiles:
  - runtime

