id: LANG-25
family: GR-LANG
part: I

title: Shaper sentinels resolve before any engine is consulted

normative: >-
  A shaper source is checked for sentinels before its engine is consulted. `_NOW_`
  yields the current timestamp in ISO 8601 form; `_NULL_` yields null;
  `_EMPTY_ARRAY_` yields the empty list; `_EMPTY_OBJECT_` yields the empty object;
  and a source prefixed `_LITERAL:` yields the rest of the string verbatim. A
  source that does reach the engine and fails there fails the node, and the failure
  names the source expression and the engine.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

related:
