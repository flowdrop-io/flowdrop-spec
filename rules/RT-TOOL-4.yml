id: RT-TOOL-4
family: RT-TOOL
part: II

title: A turn's artifacts are persisted on its message and reported on its result

normative: >-
  The artifacts a run collected MUST be persisted on the last assistant message
  that run wrote, once per run. A turn's result MUST aggregate the persisted
  artifacts of every assistant message in the turn, so they survive a reload. The
  turn API MUST report the same array. On the wire a message MUST carry them as a
  top-level `toolArtifacts` field rather than as raw message metadata.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

rulings:
  - OPEN-25

related:
  - RT-TOOL-3
  - RT-TOOL-7
