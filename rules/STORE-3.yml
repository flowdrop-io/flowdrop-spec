id: STORE-3
family: GR-STORE
part: I

title: A client-supplied id never overwrites an existing workflow

normative: >-
  A create request MAY supply the workflow's `id`. If a workflow with that id already
  exists, the request MUST be refused with 409. The stored workflow MUST be left exactly
  as it was. An implementation MUST NOT silently turn a create into an update.

posture: normative-target
level: core
profiles:
  - storage-api

added: "1.0"
changed: "1.0"

rulings:
