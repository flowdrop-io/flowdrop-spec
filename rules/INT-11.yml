id: INT-11
family: RT-ORC
part: II

title: A terminal run refuses re-entry; re-running makes a new run
summary: >-
  This is what makes cancellation durable: no requeue or rerun can resurrect a dead run
  and fire its side-effecting nodes again.

normative: >-
  A run in a terminal status (completed, failed or cancelled) MUST refuse re-entry, on
  every path that could re-enter it. A run that refuses re-entry MUST execute no work and
  MUST be left untouched. Re-running MUST always create a new run. The new run MUST be
  seeded with the source run's input and MUST record which run it is a re-run of.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

