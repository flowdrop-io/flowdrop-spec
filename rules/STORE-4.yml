id: STORE-4
family: GR-STORE
part: I

title: Absent collections default to empty, and an update touches only what it sends

summary: >-
  An update is partial. What a caller does not send, it does not change, which is
  what lets an editor save one part of a workflow without holding the whole of it.

normative: >-
  On create, `nodes` and `edges` MUST default to an empty array when absent, and
  `metadata` MUST default to empty. A
  workflow that declares no `interface` declares no ports. On update, a key the request
  omits MUST be left as stored; `name` is the exception, and MUST be present on update as
  on create. An `interface` present on update MUST rewrite both port arrays from it even
  when only one side is supplied, so a missing or empty `inputs` or `outputs` clears that
  side. The `metadata` published on read MAY differ from the `metadata` as stored. An
  implementation MAY fold envelope fields such as `format` and `schemaVersion` into it on
  read.

posture: normative-target
level: core
