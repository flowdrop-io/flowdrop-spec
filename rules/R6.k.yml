id: R6.k
family: GR-VAL
part: I

title: No save is gated on a separate per-executor config check

normative: >-
  An implementation MUST NOT refuse a save on the verdict of a per-executor
  configuration check. Save-time verdicts on a node's configuration come from R6
  and R11. A value that is wrong only at execution fails inside the node when it
  runs.

posture: normative-target
level: extended
profiles:
  - storage-api

added: "1.0"
changed: "1.0"

