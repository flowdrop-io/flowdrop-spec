id: ERR-11
family: RT-ERR
part: II

title: Retry is opt-in, in place, and immediate
summary: >-
  There is no backoff and no delay, so a retry is only ever appropriate where the node
  is idempotent. That is the author's contract, not the runtime's.

normative: >-
  A node MUST NOT retry unless its configured maximum retry count is greater than
  zero. The default maximum retry count MUST be zero. A node MUST NOT retry an error
  output that is not retryable. A node with a retryable error output MUST retry while
  its attempt count is below the configured maximum. A retry MUST re-execute the node in place. A retry
  MUST happen immediately, with no backoff. The attempt count MUST persist across the
  run, so that the maximum bounds the total attempts.

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

