id: SCH-24
family: GR-SCHEMA
part: I

title: A node type that fails to build does not fail the request

summary: >-
  One unbuildable node type costs the reader that node's metadata, not the whole
  response.

normative: >-
  Where a node type cannot be built from its own declaration or stored data, the
  failure MUST be contained. A node type whose input or output schema (SCH-1) is not a
  valid JSON Schema 2020-12 schema cannot be built: a schema that fails the 2020-12
  meta-schema, such as one whose `type` names no JSON Schema type, or that declares a
  `pattern` which is not a valid regular expression, is such a case. The request being served MUST still succeed. The node
  MUST be returned unenriched (SCH-25). The failure is recorded where an operator can
  find it. This governs failures attributable to the node type. Behaviour when an
  implementation's own extension code violates the contract it was written against is
  outside this specification, which describes conforming implementations and not
  malfunctioning ones.

posture: normative-target
level: core
profiles:
