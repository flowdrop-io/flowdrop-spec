id: CFG-9
family: GR-CFG
part: I

title: A required parameter that resolves to null fails the node

normative: >-
  Where a parameter is required and the resolution chain (CFG-4 to CFG-6) yields `null`,
  the node execution MUST fail with a missing-parameter error naming the parameter. For
  a parameter, required means non-null once resolved, not present: a `null` supplied at
  any priority fails the check. This is the named exception to required meaning present
  (Conventions, Absent, null and empty). The check MUST run after the whole chain has
  been walked, and before the resolved value would be validated (CFG-10).

posture: normative-target
level: core
profiles:
