id: R3
family: GR-VAL
part: I

title: Every edge carries a unique id

normative: >-
  Every edge in a workflow MUST carry an `id`, and edge `id`s MUST be unique within the
  workflow. An edge with no `id` MUST be refused with `R3_EDGE_MISSING_ID`, and a
  repeated `id` with `R3_EDGE_DUPLICATE_ID`. In either case the save MUST NOT take
  effect. An implementation MAY mint an id for an edge that lacks one when it reads an
  already-stored definition. That tolerance never relaxes the requirement at save.

posture: normative-target
level: core
profiles:
  - storage-api

