id: SG-12
family: RT-SG
part: II

title: Where a run's starting state comes from

normative: >-
  A run's starting state MUST be resolved in a fixed order: an explicit initial
  snapshot; else the checkpoint the caller named; else the latest state for the
  caller's thread; else a fresh state. A checkpoint identifier that resolves to
  nothing MUST be reported as a warning, and the run MUST start fresh. A
  checkpoint of a run that has already ended MUST be refused. Seeding from a
  thread whose last run ended MUST keep what the thread accumulated (its
  messages, data, metadata and thread identifier). Seeding from a thread whose
  last run ended MUST clear everything the finished run owned: its outcome, so
  the new run reports its own, and its execution position, including the
  iterator, the iteration count and the current node, so the new run starts its
  loops from the beginning. Seeding from a run that is paused rather than ended
  MUST restore it untouched, which is what keeps a pause taken mid-loop
  resumable.

posture: normative-target
level: extended
profiles:
  - runtime

