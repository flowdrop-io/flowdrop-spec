id: MEM-1
family: GR-MEM
part: I

title: Appending a tool result twice appends it once
summary: >-
  An agent loop that retries a step, or an orchestrator that re-delivers a
  result, must not double the conversation. The buffer decides by the tool
  call's id, so a repeat is a no-op rather than a second turn.

normative: >-
  Appending to a conversation buffer is idempotent by tool call id. A
  `tool`-role message whose tool call id already appears anywhere in the buffer
  (already stored, or added earlier in the same append) is dropped rather than
  appended, and the reported message count reflects the deduplicated buffer. The
  one exception is an id currently held by a synthetic healed placeholder, which
  is replaced rather than deduplicated.

posture: normative-target
level: extended
profiles:
