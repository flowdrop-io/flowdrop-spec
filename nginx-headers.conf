# Included into every location, deliberately.
#
# nginx does not merge add_header across levels: a location that sets any
# add_header discards every add_header from the server block. Each location here
# sets Cache-Control, so server-level security headers would silently vanish —
# which is exactly what happened before this file existed.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
