id: SG-6
family: RT-SG
part: II

title: Routing is decided per edge and dispatched per target

normative: >-
  Whether to follow an edge MUST be decided edge by edge. Dispatch MUST be per
  target node: several followed edges arriving at one target MUST produce a
  single dispatch of that target, not one per edge.

posture: normative-target
level: core
profiles:
  - runtime

