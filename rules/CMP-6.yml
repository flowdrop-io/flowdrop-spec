id: CMP-6
family: RT-CMP
part: II

title: Which nodes reach the execution graph
summary: >-
  A loop head needs a forward entry edge: being reachable by loopback alone is not
  enough to be scheduled, even though every re-enterable node type carries a loopback
  port.

normative: >-
  A node MUST be excluded from the execution graph if its type is non-executable,
  or if it is wired only as a tool provider. A node with no incoming edges MUST be
  included, and so MUST a node whose only incoming edges are loopback edges, which
  create no dependency (DATA-5). A node with no edges at all MUST be included. The
  two exclusions MUST be applied in that precedence.

posture: normative-target
level: core
profiles:
