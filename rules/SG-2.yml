id: SG-2
family: RT-SG
part: II

title: A node sees run state only where it asks for it, and none of it is persisted

normative: >-
  The runtime input handed to a node MUST carry the reserved internal names
  `__state__`, `__messages__` and `__data__`, plus `__iterator__` and
  `__current_item__` whenever the state carries an iterator, and
  `__interrupt_id__` when the node is being resumed. A node MUST NOT see one of
  these names unless its own parameter schema declares it. A declared internal
  parameter MUST always accept its runtime value. The live state MUST be
  handed to a node type that declares itself state-aware, and MUST NOT be handed
  to one that does not. The input
  recorded against the node's execution MUST have every reserved internal name
  removed, so that no state or interrupt internal is ever persisted, even though
  the node received it.

posture: normative-target
level: core
profiles:
  - runtime

added: "1.0"
changed: "1.0"

