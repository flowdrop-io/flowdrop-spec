id: INT-3
family: RT-INT
part: II

title: Resolving an interrupt resumes only a paused run

summary: >-
  Answering a question never restarts a run that is already moving. The reset
  and the resume are two steps in that order, which is what keeps two executors off
  the same run.

normative: >-
  Resolving an interrupt MUST locate the job it interrupted by the job identifier
  stamped on the interrupt, and MUST return that job to pending unconditionally. A
  paused run MUST then be resumed through the engine the run declares (ORC-13), never
  a different one, and MUST NOT be resumed before the job is back to pending. A run
  that is not paused MUST be left strictly alone and MUST NOT be re-entered. A
  stateless run has nothing to resume, and resolution MUST be a no-op for it.

posture: normative-target
level: core
profiles:
  - runtime

