id: DYN-2
family: GR-DYN
part: I

title: A dynamic port declares a name, a label and a data type

normative: >-
  Every dynamic port definition MUST carry a `name` and a `label`. A dynamic parameter
  definition can also carry the gate flags `connectable`, `configurable` and `required`,
  which mean what they mean on a declared parameter and default as they do there
  (CFG-1). Any definition can carry a
  `schema`, a JSON Schema 2020-12 fragment of the same kind a node type's declared
  parameter and output schemas hold, and it can carry a `dataType`. Where `schema` is
  present it is the port's schema, its lane derives from it as any property's does
  (SCH-10), and `dataType` MUST be ignored. Where `schema` is absent, `dataType` is the
  port's lane, and a definition with neither MUST be read as `mixed`. An authoring
  surface MUST NOT produce a definition whose lane is a control lane, because a dynamic
  port carries a value by definition.

posture: normative-target
level: extended
