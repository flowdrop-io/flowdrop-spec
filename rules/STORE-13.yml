id: STORE-13
family: GR-STORE
part: I

title: One name per concept for a node's type

summary: >-
  A node has a type it is an instance of and a type it is drawn as. They are different
  things, and a payload that spells both the same way cannot be read without knowing
  who wrote it.

normative: >-
  A node type's identifier MUST be `node_type_id` wherever it appears in a payload: job
  metadata, node metadata, a serialised node execution result, a node-status broadcast, a
  persisted session message. A node's visual type MUST be `visual_type` in a per-node
  snapshot payload. The bare key `node_type` MUST NOT be written anywhere. A node's own
  identifier MUST be `node_id`, and this rule does not affect it.

posture: normative-target
level: extended
profiles:
  - storage-api
  - runtime

