id: RT-GATE-14
family: RT-GATE
part: II

title: Confirmation governance is its own grant

summary: >-
  Being able to rename a node type does not imply being able to disarm its gate.
  And an actor who cannot see the setting cannot change it by saving
  the form it is hidden from.

normative: >-
  Confirmation governance MUST be controlled by a dedicated administrative
  authority, separate from the authority to administer node types. That authority
  MUST be restricted. Where an actor does not hold it, the governance settings
  MUST NOT be disclosed to that actor. A save by that actor MUST leave the stored
  governance mapping byte-identical: a setting that was never stored stays
  unstored, so the node type keeps deriving its requirement (RT-GATE-7). The
  strength of the gate is exactly the strength of who holds this authority and who
  can edit workflows.

posture: normative-target
level: core
profiles:
