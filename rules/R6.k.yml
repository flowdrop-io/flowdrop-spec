id: R6.k
family: GR-VAL
part: I

title: There is no separate per-executor config verdict

normative: >-
  A per-executor configuration-validation step was once part of the node
  executor contract. It decided nothing, and it is withdrawn: an implementation
  must not gate a save on one. Save-time verdicts on a node's configuration
  come from R6 and R11 alone, and a value that is only wrong at execution fails
  inside the node when it runs.

posture: deprecated
level: extended
profiles:
