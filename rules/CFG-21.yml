id: CFG-21
family: GR-CFG
part: I

title: A required parameter marked skip skips its node instead of failing it
summary: >-
  The exception to CFG-9. A node that was given nothing to work on is left out of the
  run, the same way an untaken branch is, and the run is not failed by it.

normative: >-
  This rule applies where a parameter is required, its `when_missing` flag is `skip`
  (CFG-20), and no priority supplied it: neither the runtime inputs (CFG-4) nor the
  saved configuration (CFG-5) carry its key, and it has no effective default (CFG-3). In
  that case the node MUST NOT be executed. The node MUST be recorded as skipped, on the
  same announcements and with the same reason as BR-7 records a skip. The node MUST NOT
  be recorded as failed, and the skip MUST NOT fail the run. A key present with a `null`
  value counts as supplied (CFG-7), and so does a `null` effective default: such a
  parameter is not missing, and its schema decides whether the `null` is acceptable
  (CFG-10).

posture: normative-target
level: extended
profiles:
  - runtime

added: "1.0"
changed: "1.0"

