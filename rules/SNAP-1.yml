id: SNAP-1
family: RT-SNAP
part: II

title: The snapshot API carries two casings, and acceptance is the lenient half
summary: >-
  Envelope keys are snake_case and the snapshot document inside them is
  camelCase, so `execution_id` and `executionId` are published by the same read
  one nesting level apart. Consumers read both, and neither spelling is normalised
  toward the other.

normative: >-
  The snapshot API's envelope-level keys MUST be snake_case. The save
  acknowledgement MUST carry `entity_id` and `execution_id`. The delete
  acknowledgement MUST carry `message` and `execution_id`. The list row MUST carry
  `entity_id`, `execution_id`, `workflow_id`, `status`, `thread_id`, `created`,
  `changed` and `node_count`. The snapshot document published under
  `data.snapshot` MUST be the snapshot's own camelCase shape, and MUST carry
  `workflowId`, `executionId`, `nodeStates`, `initialInput`, `iterationCount`,
  `threadId`, `createdAt` and `updatedAt`. The save endpoint MUST accept either
  spelling in its body. The save endpoint MUST normalise what it accepts to the
  camelCase shape. A read MUST always publish the snapshot document in camelCase. `node_count` MUST be the
  number of node states in the snapshot, not a count taken from the raw stored
  payload.

posture: normative-target
level: core
profiles:
