id: INT-13
family: RT-INT
part: II

title: A checkpoint round-trip preserves cancellation

summary: >-
  Whether a run was cancelled or completed cannot be re-derived after the fact;
  "finished" looks identical either way. So the outcome is recorded, not inferred.

normative: >-
  Execution state MUST carry its terminal outcome explicitly: completed, failed or
  cancelled, and unset while the run is live. A checkpoint MUST persist that outcome.
  A snapshot's status MUST be the persisted outcome, never a re-derivation from
  whether the run finished, which cannot express cancellation. A cancel signal MUST
  mark the state cancelled and MUST write the final checkpoint. Seeding a new turn
  from a terminal state MUST clear the run state, outcome and execution position alike
  (SG-12), so a recorded cancellation never closes a conversation thread. Only
  explicit resumption of a run is gated (INT-14).

posture: normative-target
level: extended
profiles:
