id: SCH-10.a
family: GR-SCHEMA
part: I

title: A site's lane configuration overlays the shipped one
summary: >-
  A site can recolour, rename or add lanes. What it stores is a patch on the
  shipped vocabulary; serving it as a replacement freezes the vocabulary at the
  moment it was saved.

normative: >-
  A stored site-level lane configuration MUST be served as an overlay on the shipped
  defaults, not as a replacement. Stored entries MUST win outright (a recoloured or
  renamed lane, a site-only lane, the site's own compatibility rules). Shipped entries
  the stored value never mentions MUST fill the gaps. Lanes MUST be merged per id,
  with unmentioned shipped ids appended after the stored ones, so the site's ordering
  survives. Compatibility rules MUST be unioned on the `from`/`to` pair. Scalar keys
  MUST be stored-wins. There is no negative form: a stored value MUST NOT suppress a
  shipped rule by omitting it. This is the safe direction, since a missing rule
  silently refuses a valid edge while an extra one only permits. Serving a stored
  overlay wholesale is a defect: every lane added after it was saved would go missing,
  and by SCH-10's coupling every port carrying such a lane would be compatible with
  nothing, not even with itself.

posture: normative-target
level: extended
profiles:
  - storage-api
  - editor-client

