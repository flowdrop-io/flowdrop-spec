id: R7.a
family: GR-VAL
part: I

title: An edge may not target a hidden input port

normative: >-
  An edge whose target port is a port of the target node (DYN-8) but is not exposed
  on that node MUST be refused with `R7_EDGE_TARGET_NOT_EXPOSED` at
  `edge.{index}`, where `{index}` is the edge's position in the workflow's `edges`
  array.

posture: normative-target
level: core
profiles:
