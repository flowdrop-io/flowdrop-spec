# Included into every location, deliberately.
#
# nginx does not merge add_header across levels: a location that sets any
# add_header discards every add_header from the server block. Each location here
# sets Cache-Control, so server-level security headers would silently vanish —
# which is exactly what happened before this file existed.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# frame-ancestors is ignored in a Report-Only policy, so it has to live in an
# enforcing header of its own. The full policy below is Report-Only until the
# console stays quiet on real traffic; promote it by renaming the header.
#
# Derived from the built export, not guessed:
#  - script-src / style-src 'unsafe-inline': Next's static export inlines its
#    flight-data and theme scripts and React emits style="" attributes on every
#    page. There is no per-request nonce on a static site.
#  - the one external origin is the cookieless Umami script and its collect
#    endpoint (cdn.decasteljau.factorial.io), hence script-src and connect-src.
#  - fonts are self-hosted by next/font; img-src data: covers inline SVG.
#  - no iframes, forms or plugins are rendered anywhere.
# No report-uri: no collection endpoint exists.
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.decasteljau.factorial.io; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://cdn.decasteljau.factorial.io; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
